[project]
name = "foundry-assured-mcp"
version = "0.1.0"
description = "Servidor MCP do Foundry Assured, sobre FastMCP 4"
requires-python = ">=3.12,<3.13"
dependencies = [
    "foundry-helpdesk-backend",
    # OS DOIS EXTRAS SÃO DA FASE 5 (T7), e cada um traz uma peça que este servidor usa:
    #   `tasks` → `fastmcp-tasks` + `pydocket`, o motor das background tasks (SEP-2663).
    #             Sem ele, uma tool registrada com `task=True` derruba o HANDSHAKE do servidor
    #             inteiro ("require the tasks extension") — falha alta, e a favor.
    #   `apps`  → `prefab-ui`, o renderizador do app de evidências (`mcp_app/app_evidencias.py`).
    "fastmcp[apps,tasks]==4.0.0b3",
    # PIN EXATO SOBRE PACOTE BETA, e este é o caso que a spec mandava vigiar pelo nome: o extra
    # `apps` declara `prefab-ui>=0.18.0` — faixa flutuante sobre uma biblioteca em beta que
    # anuncia breaking changes. Medido, a faixa resolvia para 0.20.2 sozinha; deixá-la flutuar
    # significa que um `uv lock` de terça-feira pode trocar a API do app sem ninguém pedir.
    # Subir esta linha é uma decisão, e é para ser uma linha de diff.
    "prefab-ui==0.20.2",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv.sources]
foundry-helpdesk-backend = { path = "../backend", editable = true }

[tool.uv]
prerelease = "allow"

[dependency-groups]
dev = [
    # MESMA versão fixada em `apps/backend/pyproject.toml`. Duas versões de ruff produziriam
    # dois rulesets sobre o mesmo repositório, e a divergência apareceria como "passa aqui,
    # falha lá" sem ninguém entender por quê.
    #
    # Este grupo NÃO arrasta o extra `agents`: o grupo `dev` do backend (que é onde aquele extra
    # pega carona) não é transitivo para quem depende do backend por path. Verificado
    # instalando — `agent-framework`, `langchain`, `langgraph` e `deepagents` continuam ausentes.
    "ruff==0.16.3",
    # O gate de fronteira DESTE app (`importlinter.toml` ao lado). O do backend tem
    # `root_packages = ["app"]` e por isso nunca viu `mcp_app` — o segundo consumidor das
    # fronteiras da ADR-017 era o único não vigiado. Mesma faixa de versão do backend.
    "import-linter>=2.13",
]

# O RULESET NÃO É COPIADO, É HERDADO. `extend` lê o `[tool.ruff]` do backend inteiro — select,
# ignore e as exceções documentadas uma a uma. Copiá-lo aqui criaria a segunda lista de sempre:
# divergiria na primeira regra nova, e a divergência não daria erro — só faria os dois apps
# serem julgados por réguas diferentes.
[tool.ruff]
extend = "../backend/pyproject.toml"

[tool.ruff.lint.isort]
# `mcp_app` é deste app e `app` é o backend; sem isto o isort trata os dois como terceiros e
# pede a ordenação errada. É a única coisa que este app precisa dizer por conta própria.
known-first-party = ["mcp_app", "app", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_app"]
