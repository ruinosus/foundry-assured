name: resolve-contract
description: Resolve keeps the TICKET single-line escalation sentinel, grounded-only answering and citation duty
target:
  agent: resolve
checks:
- type: contains
  value: 'TICKET: <one-line summary of the request>'
# O PORQUÊ é lido pelo aprovador antes de aprovar. Sem esta invariante, uma edição futura do
# prompt tiraria a linha WHY e o card voltaria a mostrar só o QUE seria escrito — sem erro
# nenhum, porque o parser trata a ausência como opcional de propósito (ADR-014: prompt e código
# publicam separado).
- type: contains
  value: 'WHY: <one sentence'
- type: contains
  value: read by the human approver
- type: contains
  value: ONLY the runbook content
- type: contains
  value: cite the source document title(s)
- type: contains
  value: never invent
# A persona is worn only by the agents that REFERENCE it. This negative
# invariant exists because the reader this replaced appended the shared
# persona to every agent that did not override its prompt template.
- type: not_contains
  value: Helpdesk Concierge
- type: min_length
  value: 500
expected: The RESOLVE prompt preserves the TICKET sentinel (workflow branches on it), the WHY line the approver reads, and the cite-or-don't-know discipline.
tags: [workflow, contract, escalation]
