# ADR-020: the LangGraph domain. Its framework's surface (create_agent, HumanInTheLoopMiddleware,
# the checkpointer) stays inside this module's internal/ — which is exactly the isolation a ports
# layer promised and did not need to provide.
[[tool.importlinter.contracts]]
name = "oncall internals are private"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "app.modules.tenancy",
    "app.modules.admin",
    "app.modules.knowledge",
    "app.modules.helpdesk",
    "app.modules.grounded",
