# Architecture gate — module boundaries checked in CI (ADR-017).
#
#     uv run lint-imports --config importlinter.toml
#
# All three contract families are live as of Phase 3: the layer rule, one privacy contract per
# module, and the independence that killed the core<->agents cycle.
#
# `allow_indirect_imports = true` on the privacy contracts is load-bearing: without it, every
# legitimate composition-root -> public -> internal chain is reported as a violation, because
# `forbidden` follows indirect imports by default. The rule we want is "no DIRECT import of
# another module's internal".

[tool.importlinter]
root_packages = ["app"]

# --- C1 — the three layers. composition may see everything; a module may see shared and other
# modules' public; shared may see nothing inside the app.
[[tool.importlinter.contracts]]
name = "Layers: composition > modules > shared"
type = "layers"
layers = [
    "app.main : app.registry",
    "app.modules",
    "app.shared",
]

# --- C2 — nothing imports the composition root.
[[tool.importlinter.contracts]]
name = "Nothing imports the composition root (app.main)"
type = "forbidden"
source_modules = ["app.modules", "app.shared"]
forbidden_modules = ["app.main"]

# --- C3 — the shared kernel imports no business module. This is the rule that makes the other
# layers mean anything: auth.py was split (ADR-017) precisely so it holds.
[[tool.importlinter.contracts]]
name = "Shared kernel imports no business module"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = ["app.modules"]

# --- C4 — the dead cycle, and only the direction that WAS the cycle.
# `independence` would forbid both directions, but only one was ever wrong: tenancy importing
# the MCP catalog to validate a connection kind. The reverse (platform_ops reading
# tenant_config for the per-tenant Foundry endpoint) is a legitimate module -> public edge and
# is in the measured graph. Forbidding it would be enforcing a rule nobody decided.
[[tool.importlinter.contracts]]
name = "tenancy does not import platform_ops (the dead cycle)"
type = "forbidden"
source_modules = ["app.modules.tenancy"]
forbidden_modules = ["app.modules.platform_ops"]

# --- C5 — internals are private. One contract per module; sources are every OTHER module plus
# the composition root, so a module can still reach its own internal.

[[tool.importlinter.contracts]]
name = "tenancy internals are private"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "app.modules.admin",
    "app.modules.knowledge",
    "app.modules.helpdesk",
    "app.modules.grounded",
    "app.modules.platform_ops",
    "app.modules.tickets",
    "app.modules.hosted",
    "app.modules.evaluation",
    "app.modules.agentdefs",
    "app.main",
    "app.registry",
    "app.shared",
]
forbidden_modules = ["app.modules.tenancy.internal"]

[[tool.importlinter.contracts]]
name = "admin internals are private"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
