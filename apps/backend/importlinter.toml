# Architecture gate — module boundaries checked in CI (ADR-017).
#
#     uv run lint-imports --config importlinter.toml
#
# PHASE 0 (this file): only contracts that are TRUE of the CURRENT layout, so the tool runs
# green from day one and a red build always means a real regression. The target contracts are
# written down below, commented, with the phase that switches each one on. Do not enable a
# contract early "to see what breaks" — a permanently red gate teaches people to ignore it.
#
# Measured facts this file relies on (re-measure, do not trust this comment):
#   - nothing under app/ imports app.main
#   - app/core/settings.py imports nothing from app
#   - app/core/tenant_store.py -> app.agents.mcp.registry is the known cycle (ADR-017 §cycle)

[tool.importlinter]
root_packages = ["app"]

# --- C0.1 — the composition root is a leaf: it imports the app, the app never imports it.
[[tool.importlinter.contracts]]
name = "Nothing imports the composition root (app.main)"
type = "forbidden"
source_modules = [
    "app.api",
    "app.agents",
    "app.core",
    "app.knowledge",
    "app.services",
    "app.tools",
    "app.workflow",
    "app.domains",
]
forbidden_modules = ["app.main"]

# C0.2 (settings imports nothing from the app) was retired in Phase 2: settings moved to
# app/shared/ and C2.1 below covers the whole shared kernel, which is strictly stronger.

# --- C2.1 (Phase 2) — the shared kernel imports nothing from the app. This is the rule that
# makes the other layers mean anything: `auth.py` was split (ADR-017) precisely so it holds.
[[tool.importlinter.contracts]]
name = "Shared kernel imports no business module"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = [
    "app.api",
    "app.agents",
    "app.core",
    "app.domains",
    "app.knowledge",
    "app.services",
    "app.tools",
    "app.workflow",
]

# --- C2.2 (Phase 2) — the core<->agents cycle is dead. tenant_store used to import the MCP
# registry for SERVERS; the composition root injects the ids now.
[[tool.importlinter.contracts]]
name = "core does not import agents (the dead cycle)"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.agents"]

# --- C3 (Phase 3) — internals are private. One contract per module; the source list is every
# OTHER module plus the composition root, so a module can still reach its own internal.
[[tool.importlinter.contracts]]
name = "tickets internals are private"
type = "forbidden"
# Direct imports only: `public.py` re-exporting from its OWN internal is the design,
# and the composition root reaching a module through its public is a legitimate chain.
# Without this, every such chain is reported as an indirect violation.
allow_indirect_imports = true
source_modules = [
    "app.modules.admin",
    "app.modules.hosted",
    "app.modules.evaluation",
    "app.main",
    "app.domains",
    "app.api",
    "app.agents",
    "app.core",
    "app.services",
    "app.workflow",
    "app.knowledge",
]
forbidden_modules = ["app.modules.tickets.internal"]

[[tool.importlinter.contracts]]
name = "admin internals are private"
type = "forbidden"
# Direct imports only: `public.py` re-exporting from its OWN internal is the design,
# and the composition root reaching a module through its public is a legitimate chain.
# Without this, every such chain is reported as an indirect violation.
allow_indirect_imports = true
source_modules = [
    "app.modules.tickets",
    "app.modules.hosted",
    "app.modules.evaluation",
    "app.main",
    "app.domains",
    "app.api",
    "app.agents",
    "app.core",
    "app.services",
    "app.workflow",
    "app.knowledge",
]
forbidden_modules = ["app.modules.admin.internal"]

