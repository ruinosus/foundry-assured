    "app.modules.hosted",
    "app.modules.evaluation",
    "app.modules.agentdefs",
    "app.modules.hitl",
    "app.main",
    "app.registry",
    "app.shared",
]
forbidden_modules = ["app.modules.deepcall.internal"]

