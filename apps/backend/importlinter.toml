# Architecture gate — module boundaries checked in CI (ADR-017).
#
#     uv run lint-imports --config importlinter.toml
#
# All three contract families are live as of Phase 3: the layer rule, one privacy contract per
# module, and the independence that killed the core<->agents cycle.
#
# `allow_indirect_imports = true` on the privacy contracts is load-bearing: without it, every
# legitimate composition-root -> public -> internal chain is reported as a violation, because
# `forbidden` follows indirect imports by default. The rule we want is "no DIRECT import of
# another module's internal".

[tool.importlinter]
root_packages = ["app"]
# Ligado só pelo contrato C4b (núcleo limpo) abaixo — nenhum outro contrato deste arquivo
# depende de pacote externo.
include_external_packages = true

# --- C1 — the three layers. composition may see everything; a module may see shared and other
# modules' public; shared may see nothing inside the app.

[[tool.importlinter.contracts]]
name = "Layers: composition > modules > shared"
type = "layers"
layers = [
    "app.main : app.registry",
    "app.modules",
    "app.shared",
]

# --- C2 — nothing imports the composition root.
[[tool.importlinter.contracts]]
name = "Nothing imports the composition root (app.main)"
type = "forbidden"
source_modules = ["app.modules", "app.shared"]
forbidden_modules = ["app.main"]

# --- C3 — the shared kernel imports no business module. This is the rule that makes the other
# layers mean anything: auth.py was split (ADR-017) precisely so it holds.
[[tool.importlinter.contracts]]
name = "Shared kernel imports no business module"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = ["app.modules"]

# --- C4 — the dead cycle, and only the direction that WAS the cycle.
# `independence` would forbid both directions, but only one was ever wrong: tenancy importing
# the MCP catalog to validate a connection kind. The reverse (platform_ops reading
# tenant_config for the per-tenant Foundry endpoint) is a legitimate module -> public edge and
# is in the measured graph. Forbidding it would be enforcing a rule nobody decided.
[[tool.importlinter.contracts]]
name = "tenancy does not import platform_ops (the dead cycle)"
type = "forbidden"
source_modules = ["app.modules.tenancy"]
forbidden_modules = ["app.modules.platform_ops"]

# --- C4b — núcleo limpo: quem só lê a KB não deve puxar framework de agente. Uma medição
# mostrou que a maioria dos módulos já não importa `agent_framework`/`langchain`/`langgraph`/
# `deepagents` — consequência não planejada das fronteiras da ADR-017. Este contrato prova o
# grafo ESTÁTICO para os módulos que devem ficar assim; `tests/architecture/nucleo_limpo_test.py`
# prova o grafo REAL (transitivo, num subprocesso), que é a prova de verdade — este contrato é
# complementar, não substituto.
#
# `import-linter` 2.13 aceita módulos externos em `forbidden_modules` desde que
# `include_external_packages = true` no nível de sessão (ver acima); sem isso o `lint-imports`
# recusa a config.
#
# `hitl` FICA DE FORA desta lista, e a ausência é deliberada, não esquecimento. O Ajuste 2
# manteve em `hitl/public.py` um import PREGUIÇOSO (dentro da função `recording_hitl`) que
# alcança LangChain só quando `oncall`/`deepcall` de fato chamam a função — o mesmo padrão de
# `tenancy/internal/tenant.py:require_domain`. Um contrato `forbidden` estático não distingue
# "alcançável só sob chamada" de "alcançável no import a frio": as duas viram a mesma aresta no
# grafo. Testado (ver relatório): silenciar essa aresta com `ignore_imports` cega o contrato até
# para uma REGRESSÃO real (voltar o import pro topo do arquivo) — pior que não ter o contrato.
# Por isso `hitl` só é coberto pelo teste dinâmico (b), que é o que sabe separar as duas coisas.
[[tool.importlinter.contracts]]
name = "nucleo limpo: sem framework de agente"
type = "forbidden"
source_modules = [
    "app.modules.knowledge.public",
    "app.modules.audit.public",
    "app.modules.tenancy.public",
    "app.modules.tickets.public",
    "app.shared.auth",
]
forbidden_modules = ["agent_framework", "langchain", "langgraph", "deepagents"]

# --- C5 — internals are private. One contract per module; sources are every OTHER module
# plus the composition root, so a module can still reach its own internal.
#
# A LISTA É COMPLETA E ORDENADA DE PROPÓSITO, e um gate cuida disso:
# `tests.architecture.importlinter_coverage_test` compara estes contratos com `app/modules/`
# e falha se faltar módulo. Cada contrato aqui nasceu copiando a lista da época e nunca foi
# atualizado, então em 2026-08 o gate reportava `22 kept, 0 broken` enquanto `oncall ->
# knowledge.internal` passava batido e `builder`/`pricing` não tinham contrato nenhum.
# Verde que não prova nada é pior que vermelho.

[[tool.importlinter.contracts]]
name = "admin internals are private"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "app.modules.agentdefs",
    "app.modules.audit",
    "app.modules.authoring",
    "app.modules.builder",
    "app.modules.conversations",
    "app.modules.deepcall",
    "app.modules.domains",
    "app.modules.evaluation",
    "app.modules.formflow",
    "app.modules.foundry",
    "app.modules.grounded",
    "app.modules.helpdesk",
    "app.modules.hitl",
    "app.modules.hosted",
    "app.modules.knowledge",
    "app.modules.oncall",
    "app.modules.okf",
    "app.modules.platform_ops",
    "app.modules.pricing",
    "app.modules.proposer",
    "app.modules.tenancy",
    "app.modules.tickets",
    "app.modules.usecases",
    "app.main",
    "app.registry",
    "app.shared",
]
forbidden_modules = ["app.modules.admin.internal"]

