[project]
name = "foundry-helpdesk-backend"
version = "0.1.0"
description = "Foundry Helpdesk backend — multi-agent workflow over AG-UI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework>=1.13.0",
    "agent-framework-ag-ui>=1.0.1",
    "azure-ai-projects>=2.4.0",
    "azure-identity>=1.25.3",
    "azure-search-documents>=11.7.0b2",
    "azure-storage-blob>=12.20.0",
    "fastapi-azure-auth>=5.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.52.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.0",
    "azure-monitor-opentelemetry>=1.8.9",
    "azure-data-tables>=12.7.0",
    "httpx>=0.28.1",
    # Validates every doc-bundle manifest we write against the vendored contract
    # (app/knowledge/docbundle.schema.json). Official validator — the format is a
    # cross-repo contract, so a hand-rolled check would only encode our reading of it.
    "jsonschema>=4.26.0",
    # Declarative agent definitions (ADR-013, ADR-015). The documents in
    # apps/backend/agents/ are Microsoft AgentSchema files and this is
    # Microsoft's own reader for that schema — its `_models.py` IS the schema.
    # The object model is imported directly: only `AgentFactory` is public there
    # and it builds an agent over a chat client, which is not the shape this
    # backend needs.
    #
    # Was pinned at ==1.0.0rc2 because 1.0.1 required agent-framework-core>=1.13.0
    # and ag-ui 1.0.0rc5 did not survive that core (`ImportError: cannot import
    # name '_try_execute_function_calls'`). That note said the move "gets its own
    # change" — this is that change: core and ag-ui moved together, and the four
    # offline gates plus a route-mounting boot were run against the result.
    "agent-framework-declarative>=1.0.1",
    # The definition documents are YAML, read here rather than through a loader
    # that would also want a chat client.
    "pyyaml>=6.0,<7.0",
    "langchain>=1.3.15",
    "langgraph>=1.2.11",
    "ag-ui-langgraph>=0.0.43.dev1786716392",
    "langchain-openai>=1.5.1",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "import-linter>=2.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
