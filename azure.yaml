# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-assured
metadata:
    template: foundry-assured@0.1.0
services:
    backend:
        project: apps/backend
        host: containerapp
        language: docker
        docker:
            path: Dockerfile
            remoteBuild: true
    # O servidor MCP, unidade de deploy PRÓPRIA desde a Fase 0c (ADR-027) — o `/mcp` não é mais
    # servido pelo `backend`. `context: ../..` porque o Dockerfile de `apps/mcp` precisa da raiz
    # do repositório no contexto de build: o app depende de `apps/backend` por path
    # (`[tool.uv.sources]`), então os dois têm que estar lá. É o que o cabeçalho daquele
    # Dockerfile documenta, e o que o gate `mcp-image` do CI já exercita.
    mcp:
        project: apps/mcp
        host: containerapp
        language: docker
        docker:
            path: Dockerfile
            context: ../..
            remoteBuild: true
    helpdesk-concierge:
        project: apps/hosted-agent
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
            startupCommand: python main.py
    platform-concierge:
        project: apps/hosted-platform
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
            startupCommand: python main.py
    selfwiki-expert:
        project: apps/hosted-selfwiki
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
            startupCommand: python main.py
    techdocs-expert:
        project: apps/hosted-techdocs
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
            startupCommand: python main.py
    web:
        project: apps/frontend
        host: containerapp
        language: docker
        docker:
            path: Dockerfile
            remoteBuild: true
            buildArgs:
                - NEXT_PUBLIC_ENTRA_TENANT_ID=${NEXT_PUBLIC_ENTRA_TENANT_ID}
                - NEXT_PUBLIC_ENTRA_SPA_CLIENT_ID=${NEXT_PUBLIC_ENTRA_SPA_CLIENT_ID}
                - NEXT_PUBLIC_ENTRA_API_CLIENT_ID=${NEXT_PUBLIC_ENTRA_API_CLIENT_ID}
hooks:
    postdeploy:
        shell: sh
        run: ./scripts/hook-postdeploy.sh
        continueOnError: true
    postprovision:
        shell: sh
        run: ./scripts/hook-postprovision.sh
        continueOnError: true
