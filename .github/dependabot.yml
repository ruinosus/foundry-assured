version: 2
updates:
  # Backend (uv / pyproject)
  - package-ecosystem: uv
    directory: /apps/backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Version-pinned transitively by agent-framework — let the framework drive
      # them; independent bumps make the resolution unsatisfiable.
      - dependency-name: azure-search-documents
      - dependency-name: fastapi
      - dependency-name: agent-framework*

  # Hosted agent (pip / requirements.txt)
  - package-ecosystem: pip
    directory: /apps/hosted-agent
    schedule: { interval: weekly }

  # Frontend (npm)
  - package-ecosystem: npm
    directory: /apps/frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # The Next build runs its own type-check through the TypeScript compiler API,
      # so NEXT decides which major is usable — not Dependabot. TypeScript 7 fails
      # the build outright ("does not provide the compiler API required by Next.js",
      # measured on #128), and it takes the whole grouped PR down with it. Bump by
      # hand together with Next.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Mesmo caso do `agent-framework*` no backend, do outro lado da casa: o CopilotKit
      # depende de `@ag-ui/*` na versão EXATA (`"0.0.57"`, sem caret), então a versão não é
      # nossa para escolher — quem a move é o CopilotKit, no bump dele.
      #
      # Subir só a nossa raiz não atualiza a dele: ficam DUAS cópias, e o typecheck cai porque
      # TypeScript compara membro privado de forma nominal (o `_debug` de `HttpAgent` deixa de
      # ser o `_debug` de `AbstractAgent`). O erro fala de "separate declarations of a private
      # property" e nunca menciona duplicata, que é o que realmente aconteceu — medido em #185.
      - dependency-name: "@ag-ui/*"

      # jsdom 30 exige Node >= 22.22 e o CI roda Node 20; `engines` do npm é AVISO, não trava,
      # então a incompatibilidade não aparece no install — aparece no gate que usa jsdom, longe
      # da causa. Junto vinham `@asamuzakjp/*`, `whatwg-url` e `undici`, todos da subárvore dele.
      # Volta a ser bumpável quando o Node do CI subir (#185).
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      # Mesma razão do `typescript` logo acima, outro pacote: eslint 10 removeu
      # `context.getFilename()`, que o `eslint-plugin-react` dentro do `eslint-config-next`
      # ainda chama — `npm run lint` não reprova, QUEBRA com TypeError. Quem decide o major do
      # ESLint é o Next; bump à mão, junto com ele.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  # Container base images
  - package-ecosystem: docker
    directories:
      - /apps/backend
      - /apps/frontend
      - /apps/hosted-agent
    schedule: { interval: weekly }
    ignore:
      # Runtime versions are pinned deliberately (Python 3.12, Node 20) — bump by hand.
      - dependency-name: python
      - dependency-name: node
