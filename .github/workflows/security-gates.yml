name: Security gates (access-control + red-team)

# Phase 4-5 of the assurance mechanism: the retrieval-path access-control gate, the
# document-content-path access-control gate (GET /source/{domain}/{name} — the newest
# access control in the product, added once it stopped being the only one uncovered here),
# and the red-team (injection-proof) gate, all run against the live KB as the test
# identities. All HARD-gate (a single cross-group leak fails the job). They self-skip when
# the test credentials aren't configured, so a fork / unconfigured clone stays green.
#
# Dispatch on demand or weekly. Uses Azure OIDC for the service token; the test users'
# password is a secret; their UPNs + group IDs + search endpoint are repo variables.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  id-token: write # Azure OIDC
  contents: read

jobs:
  gates:
    name: access-control + red-team
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
      ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      TECHDOCS_TEST_USER_A: ${{ vars.TECHDOCS_TEST_USER_A }}
      TECHDOCS_TEST_USER_B: ${{ vars.TECHDOCS_TEST_USER_B }}
      TECHDOCS_TEST_PASSWORD: ${{ secrets.TECHDOCS_TEST_PASSWORD }}
      # The gates derive entitlement from the live search ACL (not group IDs), so they
      # need only the test identities. The KB + index names default in settings to the
      # deployed ones (techdocs-kb / techdocs-docbundles-ks-index) — override here if yours
      # differ:
      # TECHDOCS_SEARCH_KNOWLEDGE_BASE: ${{ vars.AZURE_SEARCH_KNOWLEDGE_BASE }}
      # The document-content gate additionally downloads the real blob to prove the reader
      # never leaks it — needs the storage account behind the techdocs corpus container.
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_RESOURCE_ID: ${{ vars.AZURE_STORAGE_RESOURCE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install deps
        run: uv sync --frozen
      # Os gates abaixo medem VISIBILIDADE, e por isso não veriam o defeito de 2026-08-20:
      # o carimbo de ACL estava certo às 18:41 e apagado às 19:58, sem nada rodar no meio a
      # não ser a agenda automática do indexer. Um estado correto dentro da janela não prova
      # durabilidade. Este gate mede a CONFIGURAÇÃO, que não tem janela — vem primeiro porque
      # é barato e porque um carimbo com prazo de validade invalida o que vem depois.
      - name: ACL durability (nenhum índice com trim depende de indexer agendado)
        run: uv run python -m eval.acl_durability_test

      - name: MCP deployed security (SSE, WORM and egress topology)
        run: uv run python -m tests.platform_ops.mcp_deployed_security_test --require-azure

      - name: Access-control gate (no cross-group leak — agentic retrieval path)
        run: uv run python -m eval.access_control_test
      - name: Access-control gate (no cross-group leak — GET /source document path)
        run: uv run python -m eval.document_access_control_test
      - name: Red-team gate (trim is injection-proof)
        run: uv run python -m eval.red_team_test
