name: CI

# Runs on every PR and on pushes to main. The hard gates (policy self-test,
# typecheck, build, bicep) must pass; lint is advisory for now (continue-on-error).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint + policy gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Lint (ruff)
        run: uvx ruff check .
        continue-on-error: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Policy gate (planted-violation self-test)
        run: uv run python -m eval.run_eval --self-test
      - name: ACL attribution round-trip (chunk key == blob key)
        run: uv run python -m eval.test_attribution
      # Doc-bundle format contract: every manifest field this repo reads or writes
      # must exist in the producer's schema (vendored). Offline + deterministic.
      # It exists because the format already forked once — the ingest read an ACL
      # field the producer's model never had, and a second generator grew from it.
      - name: Doc-bundle contract (producer ↔ consumer field agreement)
        run: uv run python -m eval.docbundle_contract_test
      # Prompt-invariant eval suite over the declarative agent definitions — THE
      # guard of record for prompt contracts (ADR-013 phase 2; the byte-equivalence
      # gate retired when the prompts started evolving as persona + guardrails).
      # Ran as `dna eval run` from dna-cli until ADR-015 replaced the DNA SDK with
      # Microsoft's AgentSchema; the cases were always this repo's data, so they
      # stayed and the runner moved in-tree. Offline + deterministic; exits 1 on
      # any failed case.
      - name: Prompt contract suite (composed AgentSchema definitions)
        run: uv run python -m eval.prompt_contract_test

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build

  infra:
    name: Infra · bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Bicep CLI
        run: |
          curl -sLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep
          bicep --version
      - name: Compile-check Bicep
        run: bicep build infra/main.bicep --stdout > /dev/null

  # Single required status check for branch protection — green only when all
  # matrix jobs above succeed (so you protect one check, not three).
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, infra]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          [ "${{ needs.backend.result }}" = "success" ] \
          && [ "${{ needs.frontend.result }}" = "success" ] \
          && [ "${{ needs.infra.result }}" = "success" ] \
          || { echo "One or more CI jobs failed"; exit 1; }
