name: CI

# Runs on every PR and on pushes to main. All gates below — including lint — must pass.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint + policy gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      # Versão do ruff fixada em `[dependency-groups.dev]` (pyproject.toml) e travada no
      # uv.lock — `uv run` usa exatamente essa versão, não "a última disponível" como
      # `uvx ruff` faria. Upgrade de ruff vira um PR que muda o lock, não uma surpresa
      # silenciosa no gate. O ruleset em si é o `[tool.ruff.lint]` do mesmo pyproject.toml.
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Policy gate (planted-violation self-test)
        run: uv run python -m eval.run_eval --self-test
      - name: ACL attribution round-trip (chunk key == blob key)
        run: uv run python -m eval.test_attribution
      # Doc-bundle format contract: every manifest field this repo reads or writes
      # must exist in the producer's schema (vendored). Offline + deterministic.
      # It exists because the format already forked once — the ingest read an ACL
      # field the producer's model never had, and a second generator grew from it.
      - name: Doc-bundle contract (producer ↔ consumer field agreement)
        run: uv run python -m eval.docbundle_contract_test

      # Fail-closed do controle de acesso a documento integral (rota GET /source), por mutação:
      # planta o cenário "zero resultados no trim" e prova que o código levanta PermissionError em
      # vez de servir o documento. Prova por mutação que ninguém roda não é controle, é comentário.
      - name: Documento integral — fail-closed por mutação (document_access declarado, não derivado)
        run: uv run python -m tests.knowledge.document_access_test
      - name: Documento integral — contrato da rota HTTP (401/403/404, sem cache, SSRF)
        run: uv run python -m tests.knowledge.document_api_test
      - name: Documento integral — contagem autorizada (trim por blob_url, header de identidade)
        run: uv run python -m tests.knowledge.document_contar_autorizado_test

      # The fidelity gate runs at GENERATION (wiki-regen.yml), on one bundle, once. The ingest
      # then walks knowledge/wiki-bundle/** and uploads whatever is committed — so a bundle stays in
      # the knowledge base long after the code it describes has moved. Two did: they scored
      # 27.5% and 36.7% because ADR-017 relocated every backend module, and 19 pages were
      # telling the agent about files that no longer exist. This re-measures the whole shelf on
      # every push, so a stale bundle cannot sit there unnoticed. Offline + deterministic.
      - name: Wiki shelf fidelity (every COMMITTED bundle, not just the newest)
        run: uv run python -m eval.wiki_shelf_test
      # Prompt-invariant eval suite over the declarative agent definitions — THE
      # guard of record for prompt contracts (ADR-013 phase 2; the byte-equivalence
      # gate retired when the prompts started evolving as persona + guardrails).
      # Ran as `dna eval run` from dna-cli until ADR-015 replaced the DNA SDK with
      # Microsoft's AgentSchema; the cases were always this repo's data, so they
      # stayed and the runner moved in-tree. Offline + deterministic; exits 1 on
      # any failed case.
      - name: Prompt contract suite (composed AgentSchema definitions)
        run: uv run python -m eval.prompt_contract_test

      # Telemetry landed BEFORE the module refactor (spec Phase 5.5a) so the moves are not
      # made blind — a route snapshot cannot see a latency or cost regression. The risk of
      # adding it is that it stops being free, so both defaults are asserted: no exporter
      # configured → no-op, and content capture off unless explicitly switched on (I-10).
      - name: Telemetry defaults (off by default, content capture opt-in)
        run: uv run python -m tests.shared.telemetry_test

      # Route-surface snapshot — the modular-monolith refactor's safety net (ADR-017).
      # Boots the app under two fixed deployment profiles, each in its own interpreter,
      # and compares method+path against a recorded fixture. Catches the failure mode a
      # green test suite cannot: an endpoint silently lost to a forgotten import or a
      # router that stopped being included. Offline; exits 1 on any surface change.
      - name: Route surface snapshot (self_hosted + shared)
        run: uv run python -m tests.smoke.routes_snapshot_test

      # Architecture gate — module boundaries (ADR-017). Phase 0 enables only the two
      # contracts that already hold, so red always means a real regression; the target
      # contracts are written down (commented) in importlinter.toml and switch on with
      # the phase named on each.
      - name: Architecture gate (import-linter)
        run: uv run lint-imports --config importlinter.toml

      # ...e o import-linter só verifica o que a config MANDA verificar. Cada contrato
      # `<x> internals are private` lista os módulos-fonte à mão, e cada lista congelou na
      # época em que nasceu: em 2026-08 dava `22 kept, 0 broken` com `builder`/`pricing` sem
      # contrato e `oncall -> knowledge.internal` passando batido. Buraco de cobertura é a
      # AUSÊNCIA de uma linha — não se anuncia. Este gate compara a config com app/modules/.
      - name: Import-linter cobre todos os módulos (sem buraco silencioso)
        run: uv run python -m tests.architecture.importlinter_coverage_test

      # Inter-module dependency graph (ADR-017). import-linter can only guard directories
      # that exist; until Phase 3 creates them, this pins the same question against the
      # target module map and fails on a NEW cross-module edge, naming the file. Also the
      # Phase 1 red gate: a file with no module assigned fails the run.
      - name: Module dependency graph (no new coupling)
        run: uv run python -m tests.architecture.module_graph_test

      # Filesystem anchors. Three paths computed as `parents[N]` from a file's own location
      # broke during the module moves, TWO of them in silence — the tests that would have
      # caught them were already failing for unrelated reasons. Anchoring on the `app`
      # package survives any move; this forbids the fragile form outright.
      - name: Filesystem anchors (no parents[N] path counting)
        run: uv run python -m tests.architecture.filesystem_anchors_test

      # Imutabilidade declarada em infra/resources.bicep (ADR-023) precisa ser SATISFAZÍVEL.
      # `azd provision` falhou com `RequiredFeatureDisabled: Required feature Versioning is
      # disabled` porque os containers `audit`/`conversations` declaravam
      # immutableStorageWithVersioning sem o blobService pai ligar isVersioningEnabled — bicep
      # build passava porque a combinação só é rejeitada pelo Resource Manager, em deploy real.
      # Este gate prova offline que a dependência entre as duas propriedades não volta a ficar
      # implícita, e que todo container imutável tem a immutabilityPolicies correspondente.
      - name: Imutabilidade do blob storage é satisfazível (versioning + policy declarados juntos)
        run: uv run python -m tests.architecture.blob_immutability_test

      # Module invocations in YAML and shell. The other architecture gates all read Python,
      # so none of them saw that ADR-017 broke four `python -m app.knowledge.*` calls in
      # workflows and scripts. wiki-regen is workflow_dispatch, so the break only surfaced
      # when someone dispatched it, hours after the merge. Invariant I-6, as a gate.
      - name: Module invocations resolve (workflows + scripts)
        run: uv run python -m tests.architecture.module_invocations_test

      # HITL. Adopting the framework's ToolApprovalMiddleware must not change WHAT stops for a
      # human. Asserts auto_approval_rules stays empty (nothing starts "on the loop"), that role
      # filtering still runs before any rule could, and that no write tool reaches a Reader.
      - name: Approval parity (no tool silently un-gated)
        run: uv run python -m tests.platform_ops.approval_parity_test

      # HITL decisions (ADR-019). `edit` lets the approver CORRECT an action before it runs,
      # which the Agent Framework cannot express — its approval is a boolean. Editing runs the
      # action, so it needs the same role as approving; these two guard that it does, and that
      # a malformed answer becomes a reject rather than an approval.
      # MÁXIMA MAIOR: o módulo `foundry` é fino porque a gestão já é do SDK. O pouco que ele faz
      # — projetar o recurso para a interface — é onde dá para errar: vazar vocabulário de
      # plataforma, ou esconder que agente é recurso VERSIONADO. Offline.
      # Accept-Language é entrada do usuário e termina DENTRO de um prompt — a superfície mais
      # cara para se injetar texto. O gate cobre o parsing (recusa o malformado) e o payload
      # (ausência não inventa idioma).
      - name: Idioma da resposta (segue quem pergunta; header hostil não vira instrução)
        run: uv run python -m tests.grounded.language_test

      - name: Projeção de agente (versão visível, plataforma escondida)
        run: uv run python -m tests.foundry.agent_projection_test

      # O painel de ROI usa a fórmula Agent Assisted Hours que a Microsoft PUBLICA, e o ganho
      # disso — premissa citável de terceiro em vez de premissa nossa — só existe enquanto a
      # implementação ainda for a deles. Fórmula escrita à mão deriva calada: muda um peso,
      # alguém "melhora" a atribuição de desfecho, e a tela segue dizendo "Microsoft" sobre a
      # conta da casa. Este caso reproduz o exemplo numérico publicado e já pegou uma divergência
      # real (4.700 ponderadas onde o exemplo dá 4.400 — generoso no único lugar onde ser
      # generoso é fabricar resultado).
      - name: Agent Assisted Hours (bate com o exemplo publicado)
        run: uv run python -m tests.usecases.aah_formula_test

      # A medição de uso tem de ser UNIFORME por construção. `record_usage` era chamado de um
      # arquivo só, e o painel de ROI mostrava um domínio com token gravado e todos os outros com
      # zero — não por esquecimento, mas porque cada módulo construía o SEU FoundryChatClient
      # (eram cinco). Agora há uma fábrica e ela anexa o gravador; este gate proíbe a sexta
      # construção solta, que voltaria a criar um agente fora da contabilidade sem nada falhar.
      # Ele já pegou uma: o wiki_builder, que eu tinha deixado para trás.
      - name: Uso medido por construção (nenhum cliente fora da fábrica)
        run: uv run python -m tests.conversations.usage_seam_test

      # Preço por token. O casamento por prefixo mais longo fazia `gpt-5-pro` herdar o preço de
      # `gpt-5` (12× menos que o real) e `gpt-4.1-nano` herdar o de `gpt-4.1` (20× mais) — e nem
      # um nem outro chegava ao "fallback conservador", porque variante nova casa com o prefixo
      # curto antes. Este gate roda offline sobre uma captura real de `prices.azure.com` e cobra
      # que a tabela de reserva concorde com a Azure e que desconhecido devolva None.
      - name: Preço por token confere com a lista da Azure
        run: uv run python -m tests.pricing.azure_prices_test

      # Toda superfície que serve agente é AUTENTICADA e DECLARA o que grava. O primeiro item não é
      # hipotético: `add_langgraph_fastapi_endpoint` não aceita `dependencies`, e por isso /oncall e
      # /deepcall ficaram abertos — respondiam 422 sem token enquanto /helpdesk respondia 401, e
      # eram justamente os dois que abrem chamado e têm HITL de escrita. O route snapshot não pegou:
      # ele compara caminho e método, não dependência. O segundo item é o que impede o próximo
      # agente de nascer fora da contabilidade: `n/a` é resposta válida, mas exige motivo escrito.
      - name: Superfícies de agente (autenticadas + declaram o que gravam)
        run: uv run python -m tests.architecture.instrumentation_matrix_test

      # A identidade atravessa o gerador do StreamingResponse. Três lugares afirmavam o contrário,
      # com a palavra "verified", e a afirmação era carga estrutural — era a razão declarada de o
      # usuário ser capturado no endpoint. Medido contra uvicorn real: sobrevive. O gate existe pelo
      # MODO DE FALHA, não pela curiosidade: se um dia parar de atravessar, ler a identidade dentro
      # do streaming devolve None e cai na identidade da aplicação — que 403 na inferência crua e,
      # no `retrieve`, DEIXA DE TRIMAR POR ACL. Errar para "serve documento demais" é o pior lado.
      - name: A identidade atravessa o StreamingResponse
        run: uv run python -m tests.grounded.contextvar_survival_test

      # A conversa é GRAVADA de fato, não só ligada. Os outros gates olham o fio (a superfície
      # declara, o ponto de gravação existe); nenhum olhava a corrente. A diferença apareceu na
      # prática: depois de ligar seis superfícies novas, o store continha UMA conversa, anterior a
      # todo o trabalho. Este roda um `Agent` real do framework com o provider anexado do mesmo
      # jeito que `PerRequestAgent` e o workflow do helpdesk anexam, e confere o store.
      - name: A conversa é gravada de fato (provider invocado pelo framework)
        run: uv run python -m tests.conversations.provider_invoked_test

      # A resposta do FoundryAgent publicado não é gravada duas vezes. Medido contra uma conversa
      # real do selfwiki (GROUNDED_VIA_FRAMEWORK=true): `response.messages` trazia DUAS
      # reconstruções da MESMA resposta em streaming — uma sem `message_id` (com `author_name` e
      # um `text_reasoning` vazio) e outra com `message_id` (só o texto) — e o `HistoryProvider`
      # gravava as duas. Diferente do dedup por thread-reenviada (gate acima): aqui as duas
      # mensagens são NOVAS na mesma chamada, então `_ja_gravados` não pega — é outro bug.
      - name: A resposta do FoundryAgent publicado não duplica no store
        run: uv run python -m tests.conversations.duplicate_response_test

      # Os domínios de grafo gravam o TURNO, e uma vez só. O ponto não é o mesmo do token:
      # `on_llm_end` vê a chamada de MODELO (onde o token existe) e `on_chain_end` na RAIZ vê o
      # estado final do GRAFO (onde o turno existe). O filtro de raiz é o que impede duplicata —
      # `on_chain_end` dispara para cada sub-cadeia, e transcrição com resposta repetida é pior
      # que ausente, porque parece correta.
      - name: Domínios de grafo gravam o turno (uma vez, no nível certo)
        run: uv run python -m tests.conversations.langgraph_recording_test

      # As citações falam o vocabulário do FRAMEWORK, e os dois lados concordam. O painel de
      # evidências atravessa uma fronteira de linguagem (Python → SSE → TypeScript), e fronteira
      # assim quebra em silêncio: campo renomeado vira `undefined`, a tela mostra "sem fontes", e
      # isso é indistinguível de uma resposta que não citou nada. Falha grave com cara de cosmética.
      - name: Vocabulário de citação (canônico, e os dois lados concordam)
        run: uv run python -m tests.grounded.citation_vocabulary_test

      # O evento `sources` carrega o `message_id` da resposta que ele fundamenta — sem isso o
      # painel de evidência só consegue guardar a última resposta da conversa.
      - name: Evento `sources` carrega o id da resposta
        run: uv run python -m tests.grounded.sources_message_id_test

      # A citação persiste junto do turno gravado — não só passa pelo SSE. Sem isto, rolar a
      # conversa para uma resposta antiga perde a evidência que a sustentava.
      - name: Citações persistem com a conversa
        run: uv run python -m tests.conversations.citations_persisted_test

      # O header que faz o trim por documento acontecer leva o token CRU — o `Authorization` da
      # MESMA requisição leva `Bearer <token>`, e as duas regras opostas convivem lado a lado.
      # Errar dá 401 `BearerReadAccessTokenFailed`, nome que manda quem lê procurar problema de
      # permissão em vez do prefixo. Custou uma investigação inteira no verificador do selfwiki.
      - name: O header de identidade do Search leva token cru, nunca `Bearer`
        run: uv run python -m tests.knowledge.identity_header_test

      # O recorte do techdocs em níveis de acesso é DADO (knowledge/techdocs-*.json), e dado
      # errado aqui não dá erro — vaza. Os grupos são avaliados por OR, então descrever um nível
      # "interno" como ["public","internal"] LIBERA o conteúdo para quem só tem `public`. Este
      # gate simula o trim em aritmética de conjuntos, offline, em todo push.
      - name: O recorte do techdocs não vaza nível
        run: uv run python -m tests.knowledge.techdocs_tiers_test

      # Compartilhar uma conversa é um caminho EXPLÍCITO e SEPARADO do filtro por dono — nunca
      # uma relaxação dele. Prova as cinco propriedades: não-compartilhada continua ilegível para
      # outro usuário, compartilhada é legível por terceiro autenticado, a leitura por terceiro
      # nunca devolve conteúdo de documento (só a referência — quem lê o documento é sempre
      # reautorizado em `/source`, com a PRÓPRIA identidade), revogar volta ao estado original, e
      # cada transição (compartilhar/revogar/ler por terceiro) grava o evento certo na trilha.
      - name: Conversa compartilhada é caminho explícito, nunca relaxamento do filtro por dono
        run: uv run python -m tests.conversations.sharing_test

      # Os dois abaixo JÁ EXISTIAM e o CI nunca os rodou — o `trail_test` inclusive consta como
      # gate obrigatório no CLAUDE.md. Um teste fora do CI não é um gate, é uma intenção: ele
      # passa a vida inteira sem ser executado e só "reprova" quando alguém lembra de rodá-lo à
      # mão, que é justamente quando ninguém lembra. Entram aqui porque o compartilhamento
      # depende dos dois: a trilha registra compartilhar/revogar/ler, e o store guarda o que o
      # link expõe.
      - name: Trilha de auditoria — cadeia, redator e fail-closed (ADR-023)
        run: uv run python -m tests.audit.trail_test

      - name: A conversa acumula e isola por pessoa
        run: uv run python -m tests.conversations.conversation_store_test

      # O helpdesk emite as fontes por API PÚBLICA. A alternativa seria monkeypatch de `_emit_text`
      # — função privada de módulo num pacote que a ADR-020 já descreve como volátil. O nosso
      # código quebra quando NÓS mexemos; um monkeypatch quebra quando ELES publicam um minor.
      # Este gate vigia a rota pública para que ninguém a perca por engano e recorra à privada.
      - name: Fontes do helpdesk por API pública (sem monkeypatch)
        run: uv run python -m tests.helpdesk.sources_event_test

      # A fábrica do helpdesk monta DE VERDADE — direto, com recuperação ativa (usuário
      # resolvido), e pela fiação real de app.registry._mount_helpdesk. Os gates de rota/registry
      # trocam build_helpdesk_workflow por um dublê para não precisar de Foundry, e um dublê não
      # executa o corpo da fábrica — não pegaria nem um import adiado com nome errado (só estoura
      # quando o domínio é USADO) nem uma incompatibilidade de tipo que só aparece quando
      # WorkflowBuilder.build() valida o grafo com SourcesExecutor de fato na cadeia.
      - name: Fábrica do helpdesk monta de verdade (import + tipos, com recuperação ativa)
        run: uv run python -m tests.helpdesk.workflow_factory_test

      # O grounded-como-agente monta certo e nasce DESLIGADO. O gate prova a montagem, não a
      # conversa: essa é a única troca da série que não dá para verificar offline (toca OBO e ACL),
      # e o modo de falha de errar não é "quebra" — é servir documento que a pessoa não deveria ver.
      # Por isso o caminho antigo continua sendo o default até uma conversa real e o
      # `eval/access_control_test` darem o aceite.
      - name: Grounded como agente do framework (montagem + desligado por default)
        run: uv run python -m tests.grounded.framework_agent_test

      - name: Approval decisions (edit is not a loophole)
        run: uv run python -m tests.hitl.decision_test
      - name: Edit round-trips end to end
        run: uv run python -m tests.hitl.edit_roundtrip_test

      # ADR-020: two runtimes in one backend. The route snapshot's third profile is what proves
      # the LangGraph domain actually mounts (/oncall), and the registry test that the two
      # registries — backend and frontend — still mirror each other with the new kind.
      - name: Registry mirrors (five domains, two runtimes)
        run: uv run python -m tests.registry.domain_registry_test

      # shared mode: the app must BOOT with auth on (no tenant is resolved at import), and each
      # request must resolve ITS OWN tenant's domain config. The first was broken and its guard
      # was red; the second was unreachable because of the first.
      - name: Shared mode boots with auth
        run: uv run python -m tests.e2e.shared_boot_smoke_test
      - name: Shared mode resolves domain config per tenant
        run: uv run python -m tests.registry.shared_domain_spec_test

      # MCP server: Resource Server (não authorization server), papel decide as tools visíveis,
      # sem token não responde (com WWW-Authenticate apontando onde autenticar), e o token do
      # CHAMADOR — não da aplicação — chega ao retrieve. O último é o que impede a falha mais cara
      # desta camada: a tool responder bonito buscando como a identidade da aplicação, e o usuário
      # receber documento que não pode ver — sem erro, sem log, sem sintoma. Offline; o gate de
      # vazamento de verdade (com nuvem e identidades de teste) roda em security-gates.yml.
      - name: MCP — Resource Server (issuer, escopo, provider desligado sem auth)
        run: uv run python -m tests.mcpserver.auth_test
      - name: MCP — papel do Entra decide as tools visíveis
        run: uv run python -m tests.mcpserver.authz_test
      - name: MCP — sem token não responde (401 + WWW-Authenticate)
        run: uv run python -m tests.mcpserver.unauthenticated_test
      - name: MCP — o token do chamador atravessa até o retrieve (identity passthrough)
        run: uv run python -m tests.mcpserver.identity_passthrough_test

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Uma chave presente só num dicionário aparece como o próprio identificador na tela do
      # outro idioma — falha silenciosa que passa no build e só quem abre aquela tela percebe.
      - name: Paridade dos dicionários de idioma
        run: node ../../scripts/check-messages.mjs

      # Paridade não é cobertura: uma string que nunca virou chave está ausente dos DOIS
      # dicionários, e a comparação entre eles passa tranquila. Foi assim que a visão geral
      # ficou em português fixo depois de a tradução ser declarada completa.
      - name: Nenhum texto de interface fora do dicionário
        run: node ../../scripts/check-hardcoded-text.mjs

      - name: Typecheck
        run: npm run typecheck
      # O destaque do trecho citado (source-highlight.ts) roda contra um DOM real via jsdom —
      # sem este gate, uma regressão na normalização de espaço em branco só aparece quando
      # alguém clica numa citação e o trecho não acende.
      - name: Realce do trecho citado (jsdom)
        run: npm run verify:highlight
      # Reabrir uma conversa antiga precisa mostrar a citação gravada junto da resposta, não só
      # o texto — sem este gate, uma divergência entre o id que `toAguiMessages` atribui e o
      # `message_id` que `historyCitationEvents` emite volta a colar (ou perder) a fonte em
      # silêncio, do jeito que só aparece quando alguém reabre a conversa certa.
      - name: Citações ao reabrir conversa
        run: npm run verify:thread-citations
      - name: Cabeçalhos mesclados sem duplicar a caixa
        run: npm run verify:headers

      # O app importa `defaultRehypePlugins` de "streamdown" e entrega a lista ao renderer do
      # CopilotKit — o que só funciona enquanto os dois resolvem a MESMA cópia. Em 2026-08-20 o
      # dependabot subiu a declaração do app de ^1.6.11 para ^2.5.0 (major); o CopilotKit ficou
      # em ^1.3.0 com uma cópia aninhada, e o Mermaid parou de renderizar. Build verde,
      # typecheck limpo, nenhum erro — o sintoma aparece no render, longe da causa.
      - name: Renderer resolvido numa cópia só (app ↔ CopilotKit)
        working-directory: .
        run: node scripts/check-renderer-single-copy.mjs
      # ENFORCING. This gate was advisory through two consecutive breakages, and each
      # time the breakage looked exactly like success: first `next lint` (removed in
      # Next 16) exited 1 reading "lint" as a directory; then ESLint 10 CRASHED loading
      # `react/display-name`, because eslint-config-next's peer says `>=9.0.0` while its
      # own eslint-plugin-react caps at `^9.7`. Both times continue-on-error ate it.
      #
      # The previous note here said "do NOT silence the rules to make it green", and it
      # was right. So: the two rules that could be fixed WERE fixed (react-hooks/purity —
      # a randomized <tr> key remounting the row every render; react-hooks/immutability —
      # one local disable with a reason), and only `set-state-in-effect` remains, in
      # `warn`, with its size written down in eslint.config.mjs: 18 sites, 3 shapes.
      # Promote it to error when that reaches zero. No continue-on-error either way —
      # a gate that cannot fail is not a gate, and this one proved it twice.
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  infra:
    name: Infra · bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Bicep CLI
        run: |
          curl -sLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep
          bicep --version
      - name: Compile-check Bicep
        run: bicep build infra/main.bicep --stdout > /dev/null

      # Compilar não prova que sobe. Este gate lê o ARM gerado e trava a condição que faltava:
      # o segredo do Entra é OPCIONAL (o repo suporta rodar sem sign-in), mas a Azure recusa um
      # Container App secret vazio e derruba o container app inteiro — o backend simplesmente
      # não é criado, enquanto o `web` sobe normal. Um clone novo rodando o caminho padrão
      # (`up-all.sh` sem `--with-auth`) caía exatamente aí.
      - name: Clone novo sem sign-in consegue subir o backend
        run: python3 scripts/verify-optional-secret.py

      # O Pages serve `main:/docs` e o deploy dele SEMPRE passa — copia bytes, não valida
      # conteúdo. Uma página pode servir link morto por meses com o ambiente verde: a landing
      # linkava `docs/wiki` como "deep-wiki gerado" desde que a wiki virou `openwiki/`.
      - name: Links publicados no Pages resolvem
        run: python3 scripts/verify-docs-links.py

  # Single required status check for branch protection — green only when all
  # matrix jobs above succeed (so you protect one check, not three).
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, infra]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          [ "${{ needs.backend.result }}" = "success" ] \
          && [ "${{ needs.frontend.result }}" = "success" ] \
          && [ "${{ needs.infra.result }}" = "success" ] \
          || { echo "One or more CI jobs failed"; exit 1; }
