name: CI

# Runs on every PR and on pushes to main. All gates below — including lint — must pass.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint + policy gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      # Versão do ruff fixada em `[dependency-groups.dev]` (pyproject.toml) e travada no
      # uv.lock — `uv run` usa exatamente essa versão, não "a última disponível" como
      # `uvx ruff` faria. Upgrade de ruff vira um PR que muda o lock, não uma surpresa
      # silenciosa no gate. O ruleset em si é o `[tool.ruff.lint]` do mesmo pyproject.toml.
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Policy gate (planted-violation self-test)
        run: uv run python -m eval.run_eval --self-test
      - name: ACL attribution round-trip (chunk key == blob key)
        run: uv run python -m eval.test_attribution
      # Doc-bundle format contract: every manifest field this repo reads or writes
      # must exist in the producer's schema (vendored). Offline + deterministic.
      # It exists because the format already forked once — the ingest read an ACL
      # field the producer's model never had, and a second generator grew from it.
      - name: Doc-bundle contract (producer ↔ consumer field agreement)
        run: uv run python -m eval.docbundle_contract_test

      # Fail-closed do controle de acesso a documento integral (rota GET /source), por mutação:
      # planta o cenário "zero resultados no trim" e prova que o código levanta PermissionError em
      # vez de servir o documento. Prova por mutação que ninguém roda não é controle, é comentário.
      - name: Documento integral — fail-closed por mutação (document_access declarado, não derivado)
        run: uv run python -m tests.knowledge.document_access_test
      - name: Documento integral — contrato da rota HTTP (401/403/404, sem cache, SSRF)
        run: uv run python -m tests.knowledge.document_api_test
      - name: Documento integral — contagem autorizada (trim por blob_url, header de identidade)
        run: uv run python -m tests.knowledge.document_contar_autorizado_test

      # ADR-031: `document_access="session"` entrega o documento integral a QUALQUER sessão
      # autenticada, pelo nome. O catálogo diz que isso é seguro "porque o container só recebe os
      # runbooks da ingestão" — condição que morre no primeiro PDF restrito que alguém subir. Este
      # gate cobra COERÊNCIA (o que a fonte declara × o que o domínio aplica), nunca classifica
      # conteúdo — classificar seria a Regra #6 ao contrário.
      - name: Container `session` não recebe conteúdo que declare acesso (ADR-031)
        run: uv run python -m tests.knowledge.session_container_test

      # ADR-031, a outra metade: o gate acima IMPEDE declarar acesso onde ele não é aplicado;
      # este prova que, onde ele É aplicado, a declaração da fonte chega ao carimbo — e que o
      # frontmatter sai do corpo, senão o YAML vira corpus de retrieval. As duas metades são um
      # par: cada uma sozinha é um defeito.
      - name: A fonte carrega o próprio acesso (frontmatter sai do corpo, `groups` chega ao índice)
        run: uv run python -m tests.knowledge.corpus_access_declarado_test

      # O helpdesk montava `/indexes/None/docs/search` — sem host, sem índice — sempre que havia
      # usuário autenticado: o `GroundedRetrieval` chama `retrieve()` com o DomainSpec, e o spec
      # não tinha `kb_name` nem `search_index`. A chamada falhava, o `except` engolia, e o agente
      # respondia sem contexto. Com auth desligada funcionava (o provider de reserva assume), que
      # é por que nenhum gate via.
      - name: Todo domínio que recupera sabe para onde (helpdesk não monta `indexes/None`)
        run: uv run python -m tests.knowledge.helpdesk_retrieval_test

      # The fidelity gate runs at GENERATION (wiki-regen.yml), on one bundle, once. The ingest
      # then walks knowledge/wiki-bundle/** and uploads whatever is committed — so a bundle stays in
      # the knowledge base long after the code it describes has moved. Two did: they scored
      # 27.5% and 36.7% because ADR-017 relocated every backend module, and 19 pages were
      # telling the agent about files that no longer exist. This re-measures the whole shelf on
      # every push, so a stale bundle cannot sit there unnoticed. Offline + deterministic.
      - name: Wiki shelf fidelity (every COMMITTED bundle, not just the newest)
        run: uv run python -m eval.wiki_shelf_test
      # Prompt-invariant eval suite over the declarative agent definitions — THE
      # guard of record for prompt contracts (ADR-013 phase 2; the byte-equivalence
      # gate retired when the prompts started evolving as persona + guardrails).
      # Ran as `dna eval run` from dna-cli until ADR-015 replaced the DNA SDK with
      # Microsoft's AgentSchema; the cases were always this repo's data, so they
      # stayed and the runner moved in-tree. Offline + deterministic; exits 1 on
      # any failed case.
      - name: Prompt contract suite (composed AgentSchema definitions)
        run: uv run python -m eval.prompt_contract_test

      # F01/ADR-032: documentos autoráveis falham alto antes de qualquer publicação. Os três
      # gates separam sintaxe/identidade, resolução tenant-safe e autorização declarativa para
      # que uma regressão diga qual contrato foi quebrado, em vez de virar um único teste opaco.
      - name: OKF authoring profile — envelope, identity, publication state
        run: uv run python -m tests.okf.envelope_test
      - name: OKF authoring profile — references, tenancy, immutable revisions
        run: uv run python -m tests.okf.catalog_test
      - name: OKF authoring profile — writes and cannotWrite
        run: uv run python -m tests.okf.authoring_test
      - name: OKF authoring profile — schemas and ticket fixture
        run: uv run python -m tests.okf.schema_test
      - name: OKF authoring profile — legacy compatibility and migration
        run: uv run python -m tests.okf.migration_test
      - name: OKF ChangeSet — multi-document proposal and review
        run: uv run python -m tests.okf.changeset_test
      - name: Proposer remains read-only
        run: uv run python -m tests.architecture.proposer_read_only_test

      # Telemetry landed BEFORE the module refactor (spec Phase 5.5a) so the moves are not
      # made blind — a route snapshot cannot see a latency or cost regression. The risk of
      # adding it is that it stops being free, so both defaults are asserted: no exporter
      # configured → no-op, and content capture off unless explicitly switched on (I-10).
      - name: Telemetry defaults (off by default, content capture opt-in)
        run: uv run python -m tests.shared.telemetry_test

      # Route-surface snapshot — the modular-monolith refactor's safety net (ADR-017).
      # Boots the app under two fixed deployment profiles, each in its own interpreter,
      # and compares method+path against a recorded fixture. Catches the failure mode a
      # green test suite cannot: an endpoint silently lost to a forgotten import or a
      # router that stopped being included. Offline; exits 1 on any surface change.
      - name: Route surface snapshot (self_hosted + shared)
        run: uv run python -m tests.smoke.routes_snapshot_test

      # Architecture gate — module boundaries (ADR-017). Phase 0 enables only the two
      # contracts that already hold, so red always means a real regression; the target
      # contracts are written down (commented) in importlinter.toml and switch on with
      # the phase named on each.
      - name: Architecture gate (import-linter)
        run: uv run lint-imports --config importlinter.toml

      # ...e o import-linter só verifica o que a config MANDA verificar. Cada contrato
      # `<x> internals are private` lista os módulos-fonte à mão, e cada lista congelou na
      # época em que nasceu: em 2026-08 dava `22 kept, 0 broken` com `builder`/`pricing` sem
      # contrato e `oncall -> knowledge.internal` passando batido. Buraco de cobertura é a
      # AUSÊNCIA de uma linha — não se anuncia. Este gate compara a config com app/modules/.
      - name: Import-linter cobre todos os módulos (sem buraco silencioso)
        run: uv run python -m tests.architecture.importlinter_coverage_test

      # Inter-module dependency graph (ADR-017). import-linter can only guard directories
      # that exist; until Phase 3 creates them, this pins the same question against the
      # target module map and fails on a NEW cross-module edge, naming the file. Also the
      # Phase 1 red gate: a file with no module assigned fails the run.
      - name: Module dependency graph (no new coupling)
        run: uv run python -m tests.architecture.module_graph_test

      # Filesystem anchors. Three paths computed as `parents[N]` from a file's own location
      # broke during the module moves, TWO of them in silence — the tests that would have
      # caught them were already failing for unrelated reasons. Anchoring on the `app`
      # package survives any move; this forbids the fragile form outright.
      - name: Filesystem anchors (no parents[N] path counting)
        run: uv run python -m tests.architecture.filesystem_anchors_test

      # Núcleo limpo: tickets/hitl/knowledge/audit/tenancy/shared.auth não devem puxar
      # framework de agente (agent_framework/langchain/langgraph/deepagents) — consequência
      # não planejada das fronteiras da ADR-017, que abre caminho para um app separado
      # (ADR-027). O contrato `forbidden` do import-linter prova o grafo estático para a
      # maioria; este teste importa cada módulo num subprocesso e prova o grafo REAL — inclui
      # `hitl`, que o contrato estático não cobre porque mantém de propósito um import
      # preguiçoso que só alcança LangChain quando `oncall`/`deepcall` chamam a função.
      - name: Núcleo limpo (sem framework de agente nos módulos que só leem/decidem/registram)
        run: uv run python -m tests.architecture.nucleo_limpo_test

      # Imutabilidade declarada em infra/resources.bicep (ADR-023) precisa ser SATISFAZÍVEL.
      # `azd provision` falhou com `RequiredFeatureDisabled: Required feature Versioning is
      # disabled` porque os containers `audit`/`conversations` declaravam
      # immutableStorageWithVersioning sem o blobService pai ligar isVersioningEnabled — bicep
      # build passava porque a combinação só é rejeitada pelo Resource Manager, em deploy real.
      # Este gate prova offline que a dependência entre as duas propriedades não volta a ficar
      # implícita, e que todo container imutável tem a immutabilityPolicies correspondente.
      - name: Imutabilidade do blob storage é satisfazível (versioning + policy declarados juntos)
        run: uv run python -m tests.architecture.blob_immutability_test

      - name: MCP discovery — backend isolado por egress de infraestrutura
        run: uv run python -m tests.architecture.mcp_egress_infra_test

      # Module invocations in YAML and shell. The other architecture gates all read Python,
      # so none of them saw that ADR-017 broke four `python -m app.knowledge.*` calls in
      # workflows and scripts. wiki-regen is workflow_dispatch, so the break only surfaced
      # when someone dispatched it, hours after the merge. Invariant I-6, as a gate.
      - name: Module invocations resolve (workflows + scripts)
        run: uv run python -m tests.architecture.module_invocations_test

      # HITL. Adopting the framework's ToolApprovalMiddleware must not change WHAT stops for a
      # human. Asserts auto_approval_rules stays empty (nothing starts "on the loop"), that role
      # filtering still runs before any rule could, and that no write tool reaches a Reader.
      - name: Approval parity (no tool silently un-gated)
        run: uv run python -m tests.platform_ops.approval_parity_test

      - name: MCP endpoint direto — proposta inerte e aprovação tenant-safe
        run: uv run python -m tests.platform_ops.mcp_endpoint_approval_test

      - name: MCP endpoint direto — egress público e lease de discovery
        run: uv run python -m tests.platform_ops.mcp_egress_test

      - name: MCP discovery — autenticação lazy e fail-closed
        run: uv run python -m tests.platform_ops.mcp_discovery_auth_test

      - name: MCP discovery — canário de segredo fora de response e evidência
        run: uv run python -m tests.platform_ops.mcp_secret_canary_test

      - name: MCP discovery — Connection isolada por tenant
        run: uv run python -m tests.tenancy.isolation_test

      # HITL decisions (ADR-019). `edit` lets the approver CORRECT an action before it runs,
      # which the Agent Framework cannot express — its approval is a boolean. Editing runs the
      # action, so it needs the same role as approving; these two guard that it does, and that
      # a malformed answer becomes a reject rather than an approval.
      # MÁXIMA MAIOR: o módulo `foundry` é fino porque a gestão já é do SDK. O pouco que ele faz
      # — projetar o recurso para a interface — é onde dá para errar: vazar vocabulário de
      # plataforma, ou esconder que agente é recurso VERSIONADO. Offline.
      # Accept-Language é entrada do usuário e termina DENTRO de um prompt — a superfície mais
      # cara para se injetar texto. O gate cobre o parsing (recusa o malformado) e o payload
      # (ausência não inventa idioma).
      - name: Idioma da resposta (segue quem pergunta; header hostil não vira instrução)
        run: uv run python -m tests.grounded.language_test

      - name: Projeção de agente (versão visível, plataforma escondida)
        run: uv run python -m tests.foundry.agent_projection_test

      # O painel de ROI usa a fórmula Agent Assisted Hours que a Microsoft PUBLICA, e o ganho
      # disso — premissa citável de terceiro em vez de premissa nossa — só existe enquanto a
      # implementação ainda for a deles. Fórmula escrita à mão deriva calada: muda um peso,
      # alguém "melhora" a atribuição de desfecho, e a tela segue dizendo "Microsoft" sobre a
      # conta da casa. Este caso reproduz o exemplo numérico publicado e já pegou uma divergência
      # real (4.700 ponderadas onde o exemplo dá 4.400 — generoso no único lugar onde ser
      # generoso é fabricar resultado).
      - name: Agent Assisted Hours (bate com o exemplo publicado)
        run: uv run python -m tests.usecases.aah_formula_test

      # A medição de uso tem de ser UNIFORME por construção. `record_usage` era chamado de um
      # arquivo só, e o painel de ROI mostrava um domínio com token gravado e todos os outros com
      # zero — não por esquecimento, mas porque cada módulo construía o SEU FoundryChatClient
      # (eram cinco). Agora há uma fábrica e ela anexa o gravador; este gate proíbe a sexta
      # construção solta, que voltaria a criar um agente fora da contabilidade sem nada falhar.
      # Ele já pegou uma: o wiki_builder, que eu tinha deixado para trás.
      - name: Uso medido por construção (nenhum cliente fora da fábrica)
        run: uv run python -m tests.conversations.usage_seam_test

      # Preço por token. O casamento por prefixo mais longo fazia `gpt-5-pro` herdar o preço de
      # `gpt-5` (12× menos que o real) e `gpt-4.1-nano` herdar o de `gpt-4.1` (20× mais) — e nem
      # um nem outro chegava ao "fallback conservador", porque variante nova casa com o prefixo
      # curto antes. Este gate roda offline sobre uma captura real de `prices.azure.com` e cobra
      # que a tabela de reserva concorde com a Azure e que desconhecido devolva None.
      - name: Preço por token confere com a lista da Azure
        run: uv run python -m tests.pricing.azure_prices_test

      # Toda superfície que serve agente é AUTENTICADA e DECLARA o que grava. O primeiro item não é
      # hipotético: `add_langgraph_fastapi_endpoint` não aceita `dependencies`, e por isso /oncall e
      # /deepcall ficaram abertos — respondiam 422 sem token enquanto /helpdesk respondia 401, e
      # eram justamente os dois que abrem chamado e têm HITL de escrita. O route snapshot não pegou:
      # ele compara caminho e método, não dependência. O segundo item é o que impede o próximo
      # agente de nascer fora da contabilidade: `n/a` é resposta válida, mas exige motivo escrito.
      - name: Superfícies de agente (autenticadas + declaram o que gravam)
        run: uv run python -m tests.architecture.instrumentation_matrix_test

      # A identidade atravessa o gerador do StreamingResponse. Três lugares afirmavam o contrário,
      # com a palavra "verified", e a afirmação era carga estrutural — era a razão declarada de o
      # usuário ser capturado no endpoint. Medido contra uvicorn real: sobrevive. O gate existe pelo
      # MODO DE FALHA, não pela curiosidade: se um dia parar de atravessar, ler a identidade dentro
      # do streaming devolve None e cai na identidade da aplicação — que 403 na inferência crua e,
      # no `retrieve`, DEIXA DE TRIMAR POR ACL. Errar para "serve documento demais" é o pior lado.
      - name: A identidade atravessa o StreamingResponse
        run: uv run python -m tests.grounded.contextvar_survival_test

      # A conversa é GRAVADA de fato, não só ligada. Os outros gates olham o fio (a superfície
      # declara, o ponto de gravação existe); nenhum olhava a corrente. A diferença apareceu na
      # prática: depois de ligar seis superfícies novas, o store continha UMA conversa, anterior a
      # todo o trabalho. Este roda um `Agent` real do framework com o provider anexado do mesmo
      # jeito que `PerRequestAgent` e o workflow do helpdesk anexam, e confere o store.
      - name: A conversa é gravada de fato (provider invocado pelo framework)
        run: uv run python -m tests.conversations.provider_invoked_test

      # A resposta do FoundryAgent publicado não é gravada duas vezes. Medido contra uma conversa
      # real do selfwiki (GROUNDED_VIA_FRAMEWORK=true): `response.messages` trazia DUAS
      # reconstruções da MESMA resposta em streaming — uma sem `message_id` (com `author_name` e
      # um `text_reasoning` vazio) e outra com `message_id` (só o texto) — e o `HistoryProvider`
      # gravava as duas. Diferente do dedup por thread-reenviada (gate acima): aqui as duas
      # mensagens são NOVAS na mesma chamada, então `_ja_gravados` não pega — é outro bug.
      - name: A resposta do FoundryAgent publicado não duplica no store
        run: uv run python -m tests.conversations.duplicate_response_test

      # Os domínios de grafo gravam o TURNO, e uma vez só. O ponto não é o mesmo do token:
      # `on_llm_end` vê a chamada de MODELO (onde o token existe) e `on_chain_end` na RAIZ vê o
      # estado final do GRAFO (onde o turno existe). O filtro de raiz é o que impede duplicata —
      # `on_chain_end` dispara para cada sub-cadeia, e transcrição com resposta repetida é pior
      # que ausente, porque parece correta.
      - name: Domínios de grafo gravam o turno (uma vez, no nível certo)
        run: uv run python -m tests.conversations.langgraph_recording_test

      # As citações falam o vocabulário do FRAMEWORK, e os dois lados concordam. O painel de
      # evidências atravessa uma fronteira de linguagem (Python → SSE → TypeScript), e fronteira
      # assim quebra em silêncio: campo renomeado vira `undefined`, a tela mostra "sem fontes", e
      # isso é indistinguível de uma resposta que não citou nada. Falha grave com cara de cosmética.
      - name: Vocabulário de citação (canônico, e os dois lados concordam)
        run: uv run python -m tests.grounded.citation_vocabulary_test

      # O evento `sources` carrega o `message_id` da resposta que ele fundamenta — sem isso o
      # painel de evidência só consegue guardar a última resposta da conversa.
      - name: Evento `sources` carrega o id da resposta
        run: uv run python -m tests.grounded.sources_message_id_test

      # A citação persiste junto do turno gravado — não só passa pelo SSE. Sem isto, rolar a
      # conversa para uma resposta antiga perde a evidência que a sustentava.
      - name: Citações persistem com a conversa
        run: uv run python -m tests.conversations.citations_persisted_test

      # O header que faz o trim por documento acontecer leva o token CRU — o `Authorization` da
      # MESMA requisição leva `Bearer <token>`, e as duas regras opostas convivem lado a lado.
      # Errar dá 401 `BearerReadAccessTokenFailed`, nome que manda quem lê procurar problema de
      # permissão em vez do prefixo. Custou uma investigação inteira no verificador do selfwiki.
      - name: O header de identidade do Search leva token cru, nunca `Bearer`
        run: uv run python -m tests.knowledge.identity_header_test

      # O recorte do techdocs em níveis de acesso é DADO (knowledge/techdocs-*.json), e dado
      # errado aqui não dá erro — vaza. Os grupos são avaliados por OR, então descrever um nível
      # "interno" como ["public","internal"] LIBERA o conteúdo para quem só tem `public`. Este
      # gate simula o trim em aritmética de conjuntos, offline, em todo push.
      - name: O recorte do techdocs não vaza nível
        run: uv run python -m tests.knowledge.techdocs_tiers_test

      # Compartilhar uma conversa é um caminho EXPLÍCITO e SEPARADO do filtro por dono — nunca
      # uma relaxação dele. Prova as cinco propriedades: não-compartilhada continua ilegível para
      # outro usuário, compartilhada é legível por terceiro autenticado, a leitura por terceiro
      # nunca devolve conteúdo de documento (só a referência — quem lê o documento é sempre
      # reautorizado em `/source`, com a PRÓPRIA identidade), revogar volta ao estado original, e
      # cada transição (compartilhar/revogar/ler por terceiro) grava o evento certo na trilha.
      - name: Conversa compartilhada é caminho explícito, nunca relaxamento do filtro por dono
        run: uv run python -m tests.conversations.sharing_test

      # Os dois abaixo JÁ EXISTIAM e o CI nunca os rodou — o `trail_test` inclusive consta como
      # gate obrigatório no CLAUDE.md. Um teste fora do CI não é um gate, é uma intenção: ele
      # passa a vida inteira sem ser executado e só "reprova" quando alguém lembra de rodá-lo à
      # mão, que é justamente quando ninguém lembra. Entram aqui porque o compartilhamento
      # depende dos dois: a trilha registra compartilhar/revogar/ler, e o store guarda o que o
      # link expõe.
      - name: Trilha de auditoria — cadeia, redator e fail-closed (ADR-023)
        run: uv run python -m tests.audit.trail_test

      - name: A conversa acumula e isola por pessoa
        run: uv run python -m tests.conversations.conversation_store_test

      # O helpdesk emite as fontes por API PÚBLICA. A alternativa seria monkeypatch de `_emit_text`
      # — função privada de módulo num pacote que a ADR-020 já descreve como volátil. O nosso
      # código quebra quando NÓS mexemos; um monkeypatch quebra quando ELES publicam um minor.
      # Este gate vigia a rota pública para que ninguém a perca por engano e recorra à privada.
      - name: Fontes do helpdesk por API pública (sem monkeypatch)
        run: uv run python -m tests.helpdesk.sources_event_test

      # A fábrica do helpdesk monta DE VERDADE — direto, com recuperação ativa (usuário
      # resolvido), e pela fiação real de app.registry._mount_helpdesk. Os gates de rota/registry
      # trocam build_helpdesk_workflow por um dublê para não precisar de Foundry, e um dublê não
      # executa o corpo da fábrica — não pegaria nem um import adiado com nome errado (só estoura
      # quando o domínio é USADO) nem uma incompatibilidade de tipo que só aparece quando
      # WorkflowBuilder.build() valida o grafo com SourcesExecutor de fato na cadeia.
      - name: Fábrica do helpdesk monta de verdade (import + tipos, com recuperação ativa)
        run: uv run python -m tests.helpdesk.workflow_factory_test

      # O grounded-como-agente monta certo e nasce DESLIGADO. O gate prova a montagem, não a
      # conversa: essa é a única troca da série que não dá para verificar offline (toca OBO e ACL),
      # e o modo de falha de errar não é "quebra" — é servir documento que a pessoa não deveria ver.
      # Por isso o caminho antigo continua sendo o default até uma conversa real e o
      # `eval/access_control_test` darem o aceite.
      - name: Grounded como agente do framework (montagem + desligado por default)
        run: uv run python -m tests.grounded.framework_agent_test

      - name: Approval decisions (edit is not a loophole)
        run: uv run python -m tests.hitl.decision_test
      - name: Edit round-trips end to end
        run: uv run python -m tests.hitl.edit_roundtrip_test
      # O payload da decisão é onde um gesto humano vira decisão do sistema. O gate guarda as
      # duas propriedades desse ponto: a recusa leva o motivo até o backend, e NENHUM payload
      # malformado vira aprovação (fail-closed, RULE #5) — inclusive `1`, que é `int` e cujo
      # `isinstance(True, int)` já basta para transformar uma reordenação inocente num chamado
      # aberto sem ninguém aprovar.
      - name: Payload da decisão (recusa com motivo, e nada torto aprova)
        run: uv run python -m tests.helpdesk.reject_reason_test
      # A troca de vocabulário da procedência (mapa nosso → OKF v0.2) tem uma falha silenciosa:
      # recursos publicados ANTES carregam o formato antigo para sempre, e uma leitura que só
      # entendesse o novo os apagaria da trilha sem erro nenhum. O gate lê os dois — e prova que
      # o `verified` (de onde sai o trust tier) vem de `actor()`, nunca do documento.
      - name: Procedência em OKF v0.2 (e o formato antigo sobrevive)
        run: uv run python -m tests.foundry.provenance_okf_test
      # O manifesto virou a fonte do formulário, o que troca erro de compilação por documento que
      # carrega bem e produz um formulário sutilmente errado. O gate fecha os quatro modos
      # silenciosos: regra com nome que a tela não conhece (carrega e não é aplicada), dependência
      # para uma operação que não existe (trava a publicação para sempre), `ai: true` num campo
      # que o agente não sabe escrever, e documento que não é OKF.
      - name: FormFlow — os manifestos são válidos e conformantes
        run: uv run python -m tests.formflow.manifest_test
      # Um copiloto declara em que campos escreve. Sem conferir contra o formulário real, ele
      # declara o que quiser — e o erro aparece quando alguém usa a tela, na forma de uma
      # proposta para um campo que não existe. O gate prova a checagem POR MUTAÇÃO: alvo
      # inexistente, campo inexistente e campo que não aceita proposta têm de dar exatamente três
      # problemas, senão o verificador não se distingue de um `return []`.
      - name: Copiloto — o que ele declara escrever existe de verdade
        run: uv run python -m tests.formflow.copilot_test
      # O canvas de casos de uso desenhava um fluxo que ninguém executava: `write_flow` monta o
      # YAML para VALIDAR e joga o objeto fora. Este gate prova, offline e sem modelo, que o
      # fluxo declarado RODA e que um passo humano declarado pausa em `request_info` — o mesmo
      # evento que o card de aprovação da tela já escuta, sem adaptador entre os dois.
      - name: Fluxo declarado roda, e o passo humano vira gate
        run: uv run python -m tests.helpdesk.declarative_workflow_test
      # A conformidade §11 é da SPEC, não nossa, e quem a verifica é o verificador da spec
      # (vendor/okf_validate.py — ver vendor/README.md para por que copiado e não instalado).
      # Ele implementa a regra que mais se erra: cross-link quebrado NÃO é erro, porque o §6.1
      # obriga o consumidor a tolerá-lo. Um validador nosso teria isso errado no primeiro dia.
      - name: Bundles OKF v0.2 conformantes (§11)
        run: uv run python -m tests.knowledge.okf_conformance_test

      # ADR-020: two runtimes in one backend. The route snapshot's third profile is what proves
      # the LangGraph domain actually mounts (/oncall), and the registry test that the two
      # registries — backend and frontend — still mirror each other with the new kind.
      - name: Registry mirrors (five domains, two runtimes)
        run: uv run python -m tests.registry.domain_registry_test

      # shared mode: the app must BOOT with auth on (no tenant is resolved at import), and each
      # request must resolve ITS OWN tenant's domain config. The first was broken and its guard
      # was red; the second was unreachable because of the first.
      - name: Shared mode boots with auth
        run: uv run python -m tests.e2e.shared_boot_smoke_test
      - name: Shared mode resolves domain config per tenant
        run: uv run python -m tests.registry.shared_domain_spec_test

      # OS SEIS GATES DE MCP QUE MORAVAM AQUI SAÍRAM NA FASE 0c, junto com
      # `app/modules/mcpserver/`. Eles não foram removidos: foram MOVIDOS — os equivalentes
      # rodam no job `mcp-app` abaixo, contra `apps/mcp`, que é agora a única superfície MCP.
      # A garantia mudou de endereço, não de existência.

  # ---------------------------------------------------------------------------
  # O app do MCP sobre FastMCP 4 (ADR-027). Este job é DOIS gates no mesmo lugar, e o primeiro
  # é o que a ADR chama de indispensável: **a instalabilidade**.
  #
  # `uv sync` aqui instala a base do backend SEM o extra `agents` mais `fastmcp==4.0.0b3`. Essa
  # resolução só existe porque o teto `mcp<2` mora no extra `all` do `agent-framework-core`,
  # arrastado só pelo meta-pacote `agent-framework`. Um `from agent_framework import …`
  # acrescentado amanhã a `knowledge`/`audit`/`tenancy`/`shared` NÃO quebraria o backend nem o
  # `import-linter` — quebraria a instalação deste app, e é este job que fica vermelho.
  #
  # O `import-linter` prova o grafo de import; só a instalação prova a instalabilidade. Por isso
  # o passo que importa `app.modules.knowledge.public` é separado e explícito: ele é a asserção,
  # não um efeito colateral de rodar os testes.
  mcp-app:
    name: MCP app · instalabilidade + paridade
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # SEM `--extra agents` de propósito — ver o comentário acima. O grupo `dev` DESTE app
      # entra (só o ruff fixado); o grupo `dev` do BACKEND, que é onde o extra `agents` pega
      # carona, não é transitivo para quem depende dele por path — verificado instalando.
      - name: Instala a base do backend SEM o extra `agents`, com FastMCP 4
        run: uv sync --frozen
      # Mesmo ruff, mesma versão, MESMO ruleset do backend (`[tool.ruff] extend`). Sem este
      # passo o app novo seria o único canto do repositório sem lint, e o gate do backend
      # continuaria verde sem ver nada disto.
      - name: Lint (ruff)
        run: uv run --no-sync ruff check .
      # O SEGUNDO CONSUMIDOR DAS FRONTEIRAS DA ADR-017, e até aqui o único não vigiado. O
      # `importlinter.toml` do backend tem `root_packages = ["app"]`, então ele nunca enxergou
      # `mcp_app` — nada impedia um `from app.modules.knowledge.internal import …` de nascer
      # aqui, com o gate do vizinho verde. O contrato ao lado (`apps/mcp/importlinter.toml`)
      # cobra a mesma regra 8 de fora para dentro: a entrada no backend é pelo `public`.
      - name: Fronteiras — apps/mcp entra no backend só pelo `public` (ADR-017)
        run: uv run --no-sync lint-imports --config importlinter.toml
      - name: O núcleo é importável sem framework de agente
        run: |
          uv run --no-sync python -c "
          import importlib.metadata as md, sys
          import app.modules.knowledge.public
          assert md.version('fastmcp').startswith('4.'), md.version('fastmcp')
          assert md.version('mcp').startswith('2.'), md.version('mcp')
          for pesado in ('agent_framework_ag_ui', 'langchain', 'langgraph', 'deepagents'):
              assert pesado not in sys.modules, pesado
          print('fastmcp', md.version('fastmcp'), '| mcp', md.version('mcp'))
          "
      # A GARANTIA DO MCP MORA AQUI, e só aqui, desde a Fase 0c. Os seis primeiros nasceram como
      # paridade com o `/mcp` do monolito (`tests/mcpserver/`, deletado com ele); agora são o
      # único lugar onde as propriedades são verificadas. O de identidade é o que impede a falha
      # mais cara desta camada — a tool responder bonito buscando como a identidade da
      # APLICAÇÃO, e o usuário receber documento que não pode ver, sem erro, sem log, sem
      # sintoma. O sétimo (matriz) é o vigia de superfície NOVA que a matriz do monolito perdeu
      # quando `/mcp` saiu de lá na Fase 0c — sem ele, uma superfície nova podia nascer sem
      # `auth=` ou sem declarar o que grava, e nada aqui reprovaria. Os seguintes guardam o que
      # a Fase 1 acrescentou (prompts, resource, completion, e o cliente real que atravessa a
      # pilha), e o último guarda a Fase 2 — o selo de assurance.
      - name: MCP — Resource Server (issuer, escopo, provider desligado sem auth)
        run: uv run --no-sync python -m tests.auth_test
      - name: MCP — papel do Entra decide as tools visíveis (any-of, não all-of)
        run: uv run --no-sync python -m tests.authz_test
      - name: MCP — sem token não responde (401 + WWW-Authenticate que leva a 200)
        run: uv run --no-sync python -m tests.unauthenticated_test
      - name: MCP — o token do chamador atravessa até o retrieve (identity passthrough)
        run: uv run --no-sync python -m tests.identity_passthrough_test
      - name: MCP — erro não conta a infraestrutura para o chamador
        run: uv run --no-sync python -m tests.error_masking_test
      - name: MCP — modo shared resolve tenant E cobra entitlement (ADR-010)
        run: uv run --no-sync python -m tests.shared_tenancy_test
      # E A CREDENCIAL QUE A LEITURA EXIGE, que é da camada de DEPLOY e por isso nenhum gate
      # daqui via. `search_docs`, `document://` e a completion chamam o `knowledge.retrieve` do
      # backend, que faz OBO — fluxo de cliente confidencial. O `env` do container do MCP
      # carregava `ENTRA_TENANT_ID` e `ENTRA_API_CLIENT_ID` e NÃO o segredo, e
      # `OnBehalfOfCredential` nem constrói assim (medido). Na `main` isso não existia: o `/mcp`
      # morava no backend, que tem o segredo. Este gate compara o que o CÓDIGO lê (derivado da
      # fonte de `_user_search_token`) com o que o BICEP declara.
      - name: MCP — o container recebe a credencial que o OBO exige
        run: uv run --no-sync python -m tests.obo_credential_test
      - name: MCP — toda superfície exige papel do Entra e declara o que grava (matriz)
        run: uv run --no-sync python -m tests.instrumentation_matrix_test
      # A FASE 1 acrescentou DUAS famílias de superfície — prompts e um resource template — e os
      # três gates abaixo são o que impede cada uma de nascer torta. O espelho é o mais
      # importante: um prompt escrito à mão dentro de `apps/mcp` seria uma segunda verdade ao
      # lado dos documentos AgentSchema, e a divergência não daria erro — só faria o cliente MCP
      # ver um conjunto de agentes diferente do que o produto roda.
      #
      # Nenhum deles toca rede ou daemon: agentdefs lê os documentos do repositório, o ACL e o
      # `retrieve` são substituídos, e o screening de caminho é do próprio FastMCP. É o que
      # `scripts/gates.py` promete de `DEFAULT_JOBS` (offline e determinístico), e o motivo de o
      # `docker build` morar no job `mcp-image` e não aqui.
      - name: MCP — os prompts publicados são exatamente os agentes compostos (espelho)
        run: uv run --no-sync python -m tests.prompts_mirror_test
      - name: MCP — o documento integral usa o ACL do backend, e nome não vira caminho
        run: uv run --no-sync python -m tests.resource_document_test
      - name: MCP — a completion só sugere o que existe e o que o chamador pode abrir
        run: uv run --no-sync python -m tests.completion_test
      # O SEGUNDO CRITÉRIO DE PRONTO DA FASE 1 ("um cliente lista prompts e lê um resource com
      # ACL aplicada") não era exercitado por gate nenhum: `authz_test` prova a função de
      # decisão, a matriz prova que o `auth=` existe — nenhum dos dois prova que o FastMCP
      # FILTRA. Este sobe a aplicação que `build_app()` monta e fala com ela por um `Client` de
      # verdade, com dois tokens que diferem só no claim `roles`.
      #
      # Continua offline e sem daemon: o transporte é `httpx2.ASGITransport` (a pilha HTTP
      # inteira, em processo, sem socket), e o verificador de token é estático — o
      # `AzureJWTVerifier` buscaria o JWKS do Entra pela rede, que é o que tiraria este passo de
      # `DEFAULT_JOBS` em `scripts/gates.py`.
      - name: MCP — um cliente real lista prompts, lê o resource, e sem papel não vê nada
        run: uv run --no-sync python -m tests.client_surface_test
      # A FASE 2 — o SELO, que é a camada que motivou separar o MCP num app próprio (ADR-027).
      # Este gate guarda as três propriedades que decidem se o selo vale alguma coisa, e todas
      # as três falham em SILÊNCIO se ninguém as vigiar:
      #
      #   negociado    quem não anuncia a extensão tem que receber a resposta IDÊNTICA à de
      #                antes desta fase. O teste compara contra um servidor montado SEM a
      #                extensão — não contra uma expectativa escrita à mão, que envelheceria.
      #   não inventa  cada campo do selo é copiado de uma fonte que já existia. Provado por
      #                MUTAÇÃO: muda-se a fonte e mostra-se o selo mudando junto.
      #   não vaza     com um chamador sem acesso, o evento que a trilha grava NOMEIA o
      #                documento negado, e o selo carrega o id do evento sem carregar o nome.
      #
      # Offline como os outros: `httpx2.ASGITransport`, verificador de token estático,
      # `retrieve` substituído. A TRILHA é a real — sem `AZURE_STORAGE_ACCOUNT` ela cai no
      # `InMemoryTrail`, que encadeia por hash igual à de produção.
      - name: MCP — o selo é negociado, não inventa e não vaza (extensão de protocolo)
        run: uv run --no-sync python -m tests.assurance_seal_test
      # A FASE 3 — a primeira ESCRITA por MCP, e por isso o gate mais caro de faltar. Ele guarda
      # a regra 5 do projeto (`create_ticket` só dispara após aprovação humana explícita, com o
      # papel Approver ou Admin) em cinco frentes, e nenhuma delas se prova sozinha:
      #
      #   as quatro    aprovar · EDITAR · rejeitar · responder atravessam inteiras. O `edit` é a
      #                razão da ADR-019 e é o que um booleano não expressa; aqui ele grava o
      #                texto do APROVADOR, não o que chegou na chamada.
      #   inalcançável não há caminho até a escrita sem a decisão — nem chamando a tool direto,
      #                nem mandando respostas sem o `requestState`, nem forjando um.
      #   o papel      duas linhas, e a de baixo só se prova por MUTAÇÃO: com o `auth=` removido,
      #                `hitl.decide` continua recusando quem não é aprovador.
      #   a trilha     dois eventos por escrita (a decisão e a escrita), com o ator certo.
      #   o segredo    sem `MCP_REQUEST_STATE_KEY` a escrita se declara indisponível e a LEITURA
      #                continua de pé; com uma chave curta demais, o app não sobe.
      #
      # Offline como os demais: `httpx2.ASGITransport`, verificador de token estático, chamados
      # num diretório temporário, e a chave do `requestState` GERADA na hora — nunca lida do
      # repositório, que é a ADR-005 aplicada ao próprio teste.
      #   o estado é de UM  o `requestState` de um principal não serve para outro — nem para um
      #                     segundo aprovador, mesmo papel, `sub` diferente. Também por MUTAÇÃO.
      - name: MCP — a escrita só atravessa com decisão humana e papel (as quatro decisões)
        run: uv run --no-sync python -m tests.write_decision_test
      # E O INVARIANTE QUE FALTAVA: uma decisão humana, UMA escrita. O envelope do SDK é
      # verificável mas não é de uso único — sem uma reserva por rodada, o cliente repetia
      # `tools/call` com o mesmo `requestState` e abria o segundo e o terceiro chamado, inclusive
      # de sessão nova, com a trilha gravando duas aprovações onde houve uma. Este gate carrega
      # as DUAS metades da prova: roda o ataque com a reserva neutralizada (3 chamados) e com ela
      # valendo (1), então ele fica vermelho no dia em que a reserva virar no-op.
      #
      # Offline e sem daemon como os vizinhos. O subprocesso que prova "não é memória de
      # processo" é o MESMO interpretador, sem rede — é o modelo do `minReplicas: 0` (a réplica
      # morre entre a pergunta e a resposta) e da segunda réplica.
      - name: MCP — um `requestState`, uma escrita (o estado não é replayável)
        run: uv run --no-sync python -m tests.decision_replay_test
      # A FASE 5 (T7) — o hint de cache (SEP-2549), ligado para as LISTAGENS e para mais nada.
      #
      # O atalho `cache_ttl=` do construtor é UNIFORME (`dict.fromkeys(get_args(CacheableMethod))`)
      # e alcançaria `resources/read`, que aqui é o documento controlado por ACL cuja leitura a
      # trilha (ADR-023) registra uma a uma — inclusive as negadas. Um TTL ali autoriza o cliente
      # a servir a leitura do armazenamento dele: a leitura deixa de chegar aqui, deixa de virar
      # evento, e o produto continua afirmando que registra toda leitura. O mapa POR MÉTODO do SDK
      # debaixo do FastMCP resolve isso, e é o que `mcp_app/cache_hints.py` instala.
      #
      # O gate mede o FIO, não o atributo: um teste que lesse `mcp._mcp_server.cache_hints`
      # ficaria verde para sempre se o seam fosse renomeado — o hint sumiria das respostas e o
      # dicionário continuaria lá. Três provas por mutação ao lado, porque `ttlMs=0` em
      # `resources/read` seria indistinguível de "nenhum hint funciona".
      - name: MCP — o cache cobre as listagens e nunca `resources/read` (medido no fio)
        run: uv run --no-sync python -m tests.cache_hints_test
      # AS BACKGROUND TASKS (SEP-2663). A metade OFFLINE do item: o critério de quem vira task em
      # forma executável (`search_docs` sim, `open_ticket` não — quem demora nela é o humano, e o
      # humano já tem a suspensão do SEP-2322), as duas variáveis que as ligam, e duas provas por
      # mutação. A segunda variável é a que ninguém adivinharia: sem chave de cifra, o snapshot
      # com o access token do chamador vai ao Redis em claro E uma falha ao restaurá-lo faz a
      # task rodar SEM identidade — com o ACL e a trilha errados. O gate mede isso no CODEC, não
      # na variável de ambiente, porque é o codec que decide na hora de gravar.
      #
      # Offline e sem daemon: `memory://` não precisa de nada, e é justamente ele que serve de
      # prova negativa — um subprocesso não acha a task que este processo aceitou.
      - name: MCP — só a busca vira task, e só com backend durável e cifra
        run: uv run --no-sync python -m tests.tasks_backend_test
      # A TABELA DE EVIDÊNCIAS (MCP App) e o ESTADO POR USUÁRIO que a alimenta — as duas metades
      # da mesma feature, num gate só, porque separadas cada uma passa sozinha sem provar o que
      # importa: as citações que UM chamador recebeu chegam à tabela DELE e não à de outro.
      #
      # Ele também guarda a armadilha que quase deixou uma superfície sem gate nascer: pelo
      # caminho padrão de MCP Apps o FastMCP SINTETIZA um renderizador `auth=None` que
      # `Provider.list_resources` não enxerga. Aqui a síntese tem que vir VAZIA — o app aponta
      # para uma URI própria e registra o recurso com o mesmo `require_any_role` do resto.
      # E o renderizador vem do wheel (6,3 MiB), não de `cdn.jsdelivr.net`: o custo dos dois
      # lados é medido no gate para não virar folclore.
      - name: MCP — a evidência chega a quem buscou, e o renderizador tem dono
        run: uv run --no-sync python -m tests.app_evidencias_test
      # O REDIS CONFIGURADO E FORA DO AR — o cenário que o `Basic C0` torna rotina, porque o SKU
      # não tem réplica e a manutenção dele é uma queda. Medido antes deste gate existir: as
      # CINCO superfícies de leitura devolviam `MCPError: Internal server error`, inclusive a
      # busca síncrona, que não usa Redis para nada. E a causa não era a extensão de tasks (o
      # Docket reconecta em laço): era a LOJA DE SESSÃO — o FastMCP lê o `session_state_store` em
      # toda requisição, por dentro (`transforms/visibility.py:316`).
      #
      # O gate prova as duas metades do conserto: a leitura de pé (a loja cai para memória de
      # processo, que é o modo sem Redis já declarado) e a CAPACIDADE fora (o gate de boot passou
      # a fazer `PING`, então a extensão nem sobe e quem pede task recebe erro que diz isso, em
      # vez do mascarado). Prova por mutação junto: com a loja crua, a mesma leitura morre.
      #
      # Offline e sem daemon: uma porta fechada em `127.0.0.1` recusa a conexão na hora.
      - name: MCP — Redis fora do ar derruba a capacidade, nunca as leituras
        run: uv run --no-sync python -m tests.redis_outage_test

  # JOB SEPARADO DE PROPÓSITO, e a razão está em `scripts/gates.py:42`: o que entra em
  # `DEFAULT_JOBS` é prometido como "inteiramente offline e determinístico", e a bateria local
  # deriva daí. Um `docker build` não é nenhum dos três — puxa imagem base, resolve pacote da
  # rede e leva minutos. Colocado dentro de `mcp-app`, ele transformou `scripts/gates.py` de
  # 2 minutos em mais de 10, exigindo daemon do Docker para rodar o que era offline. Medido.
  #
  # Aqui ele continua BARRANDO O MERGE (está em `needs` do `ci-ok`), que é o que importa —
  # só deixa de ser arrastado para a bateria local.
  # O CENÁRIO DO `minReplicas: 0`, com um Redis de verdade. Job próprio pelo mesmo motivo do
  # `mcp-image`: precisa de daemon, e `scripts/gates.py` promete `DEFAULT_JOBS` inteiramente
  # offline. Continua BARRANDO O MERGE (está em `needs` do `ci-ok`) — ele prova a propriedade
  # que decidiu comprar o recurso, então não pode ser opcional.
  #
  # O gate offline vizinho (`tasks_backend_test`) prova a metade NEGATIVA: com `memory://`, um
  # processo novo não acha a task. A metade positiva não cabe offline — só um backend
  # compartilhado de verdade mostra a task sobrevivendo à réplica que a aceitou.
  #
  #   task     P1 aceita e MORRE ABRUPTAMENTE dentro da sessão (um desligamento gracioso deixa
  #            o worker CANCELAR a execução, e o gate ficaria verde sobre o cenário errado).
  #            P2 — interpretador novo, servidor novo — acha o id e a vê TERMINAR.
  #   sessão   P1 grava sob um principal e morre; P2 lê o mesmo valor, e não lê o de outro
  #            principal. Durabilidade e isolamento na mesma medição.
  mcp-durable:
    name: MCP app · task e sessão sobrevivem à réplica (Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instala a base do backend SEM o extra `agents`, com FastMCP 4
        run: uv sync --frozen
      - name: MCP — a task e a sessão sobrevivem à morte da réplica
        env:
          MCP_REDIS_URL: redis://localhost:6379/0
        run: uv run --no-sync python -m tests.durability_test

  mcp-image:
    name: MCP app · a imagem builda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # O contexto é a RAIZ do repo, não `apps/mcp` — é o que o próprio `Dockerfile` documenta
      # no cabeçalho, porque `apps/mcp` depende de `apps/backend` por path e os dois precisam
      # estar no contexto de build. Nada provava que esse arranjo funciona até este gate.
      - name: Build da imagem (Dockerfile)
        run: docker build -f apps/mcp/Dockerfile -t foundry-assured-mcp:ci .
      # E O QUE A IMAGEM RESOLVE COMO CAMINHO DE DADOS, comparado com o `mountPath` que o bicep
      # declara PARA ELA. Mora aqui e não em `mcp-app` porque só existe resposta dentro da
      # imagem: a raiz do backend é propriedade do Dockerfile (`/srv/backend` aqui, `/app` na
      # imagem do backend), não da árvore de trabalho.
      #
      # Medido antes deste gate: o bicep montava `/app/data` no container do MCP, e `/app` NEM
      # EXISTE nesta imagem. O chamado aberto por MCP ia para disco efêmero — e junto com ele a
      # reserva de nonce, o que devolvia o replay que a Fase 3 tinha acabado de fechar. O gate
      # vizinho (`decision_replay_test`) não pegava: ele prova que os dois caminhos são IRMÃOS,
      # o que é verdade também no disco errado.
      - name: MCP — o caminho de dados da IMAGEM é o mount que o bicep declara
        run: |
          docker run --rm \
            -v "$PWD/infra:/infra:ro" \
            -v "$PWD/apps/mcp/tests/image_data_path_test.py:/gate/image_data_path_test.py:ro" \
            -e MCP_BICEP=/infra/containerapps.bicep -e PYTHONPATH=/gate \
            foundry-assured-mcp:ci python -m image_data_path_test

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Uma chave presente só num dicionário aparece como o próprio identificador na tela do
      # outro idioma — falha silenciosa que passa no build e só quem abre aquela tela percebe.
      - name: Paridade dos dicionários de idioma
        run: node ../../scripts/check-messages.mjs

      # Paridade não é cobertura: uma string que nunca virou chave está ausente dos DOIS
      # dicionários, e a comparação entre eles passa tranquila. Foi assim que a visão geral
      # ficou em português fixo depois de a tradução ser declarada completa.
      - name: Nenhum texto de interface fora do dicionário
        run: node ../../scripts/check-hardcoded-text.mjs

      - name: Typecheck
        run: npm run typecheck
      # O destaque do trecho citado (source-highlight.ts) roda contra um DOM real via jsdom —
      # sem este gate, uma regressão na normalização de espaço em branco só aparece quando
      # alguém clica numa citação e o trecho não acende.
      - name: Realce do trecho citado (jsdom)
        run: npm run verify:highlight
      # Reabrir uma conversa antiga precisa mostrar a citação gravada junto da resposta, não só
      # o texto — sem este gate, uma divergência entre o id que `toAguiMessages` atribui e o
      # `message_id` que `historyCitationEvents` emite volta a colar (ou perder) a fonte em
      # silêncio, do jeito que só aparece quando alguém reabre a conversa certa.
      - name: Citações ao reabrir conversa
        run: npm run verify:thread-citations
      - name: Cabeçalhos mesclados sem duplicar a caixa
        run: npm run verify:headers
      # O card de proposta compara o texto do campo com o que o agente propôs. Um diff que perde
      # ou inventa um pedaço MOSTRA um texto que não é o que será gravado — a pior falha possível
      # numa tela onde alguém aprova texto que vai ser publicado. O gate reconstrói os dois lados
      # a partir do resultado e falha se não baterem byte a byte.
      - name: Diff da proposta de campo
        run: npm run verify:text-diff
      # A procedência que viaja no `metadata` da versão publicada fala OKF v0.2 (a spec do Google
      # Cloud que este repositório já produz em `openwiki/`). O gate guarda a distinção que
      # motivou a troca: um campo escrito pelo agente SEM fonte continua aparecendo, em vez de
      # sumir e virar indistinguível de um campo digitado à mão.
      - name: Procedência em OKF v0.2
        run: npm run verify:okf
      # O GATE QUE DEFINE A CAMADA FORMFLOW: o motor não decide nada por QUAL campo é. Uma linha
      # `if (campo.id === "instructions")` significa que estamos de volta a três wizards escritos
      # à mão com um invólucro comum. Os ids vêm dos manifestos reais, não de uma lista aqui — um
      # campo novo no documento passa a ser vigiado sem ninguém lembrar de acrescentá-lo. O gate
      # também prova que o vocabulário de regras é o mesmo dos dois lados.
      - name: FormFlow — o motor não conhece campo nenhum
        run: npm run verify:formflow
      # A falha PARCIAL é o que o executor existe para acertar: publicar uma skill são duas
      # chamadas, e quando a segunda falha a skill EXISTE. Sem isso a tela diz "erro", a pessoa
      # tenta de novo, e a segunda tentativa falha na PRIMEIRA operação — agora por nome
      # duplicado, com uma mensagem sem relação com o problema.
      - name: Plano de publicação (dependência, falha parcial, retentativa)
        run: npm run verify:plan
      # A matriz de recursos do motor carrega uma regra de design: "não precisa" NÃO é "não
      # cumpre". Um copiloto de RH não fica pior por não ter trilha encadeada — ele não tem peça
      # probatória a sustentar. Se alguém acrescentar pontuação ou fração, ausência legítima vira
      # dívida, e a reação de quem lê é declarar recursos que o domínio não pede.
      - name: Matriz do copiloto (dois lados, nenhuma nota)
        run: npm run verify:copilot-matrix
      # O ÚNICO gate que fecha o ciclo: a tela monta o YAML no browser, o loader do backend o lê e
      # `verificar_alvos` o julga. Dois lados, dois idiomas, e nada garante que produzam a mesma
      # coisa — um título com dois-pontos sem aspas, um `targets:` vazio que vira nulo, e o
      # copiloto criado pela tela é um copiloto que o produto recusa. O gate escreve o documento
      # num diretório temporário e roda o loader DE VERDADE por cima (via AGENTS_DIR), em vez de
      # comparar strings: comparar strings provaria que o gerador não mudou; isto prova que ele
      # produz algo que o consumidor aceita.
      - name: O copiloto criado pela tela carrega no backend
        run: npm run verify:copilot-doc

      # O app importa `defaultRehypePlugins` de "streamdown" e entrega a lista ao renderer do
      # CopilotKit — o que só funciona enquanto os dois resolvem a MESMA cópia. Em 2026-08-20 o
      # dependabot subiu a declaração do app de ^1.6.11 para ^2.5.0 (major); o CopilotKit ficou
      # em ^1.3.0 com uma cópia aninhada, e o Mermaid parou de renderizar. Build verde,
      # typecheck limpo, nenhum erro — o sintoma aparece no render, longe da causa.
      - name: Renderer resolvido numa cópia só (app ↔ CopilotKit)
        working-directory: .
        run: node scripts/check-renderer-single-copy.mjs
      # ENFORCING. This gate was advisory through two consecutive breakages, and each
      # time the breakage looked exactly like success: first `next lint` (removed in
      # Next 16) exited 1 reading "lint" as a directory; then ESLint 10 CRASHED loading
      # `react/display-name`, because eslint-config-next's peer says `>=9.0.0` while its
      # own eslint-plugin-react caps at `^9.7`. Both times continue-on-error ate it.
      #
      # The previous note here said "do NOT silence the rules to make it green", and it
      # was right. So: the two rules that could be fixed WERE fixed (react-hooks/purity —
      # a randomized <tr> key remounting the row every render; react-hooks/immutability —
      # one local disable with a reason), and only `set-state-in-effect` remains, in
      # `warn`, with its size written down in eslint.config.mjs: 18 sites, 3 shapes.
      # Promote it to error when that reaches zero. No continue-on-error either way —
      # a gate that cannot fail is not a gate, and this one proved it twice.
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  infra:
    name: Infra · bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Bicep CLI
        run: |
          curl -sLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep
          bicep --version
      - name: Compile-check Bicep
        run: bicep build infra/main.bicep --stdout > /dev/null

      # Compilar não prova que sobe. Este gate lê o ARM gerado e trava a condição que faltava:
      # o segredo do Entra é OPCIONAL (o repo suporta rodar sem sign-in), mas a Azure recusa um
      # Container App secret vazio e derruba o container app inteiro — o backend simplesmente
      # não é criado, enquanto o `web` sobe normal. Um clone novo rodando o caminho padrão
      # (`up-all.sh` sem `--with-auth`) caía exatamente aí.
      #
      # DESDE A FASE 3 (T3) ele olha DOIS apps: o `mcp` ganhou `MCP_REQUEST_STATE_KEY`, a chave
      # que assina a decisão humana da escrita, opcional pelo mesmo desenho. Vigiar só o backend
      # deixaria a mesma falha nascer no vizinho.
      - name: Clone novo sem os segredos opcionais consegue subir backend e mcp
        run: python3 scripts/verify-optional-secret.py

      # O Pages serve `main:/docs` e o deploy dele SEMPRE passa — copia bytes, não valida
      # conteúdo. Uma página pode servir link morto por meses com o ambiente verde: a landing
      # linkava `docs/wiki` como "deep-wiki gerado" desde que a wiki virou `openwiki/`.
      - name: Links publicados no Pages resolvem
        run: python3 scripts/verify-docs-links.py

  # Single required status check for branch protection — green only when all
  # matrix jobs above succeed (so you protect one check, not three).
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, mcp-app, mcp-durable, mcp-image, frontend, infra]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          [ "${{ needs.backend.result }}" = "success" ] \
          && [ "${{ needs.mcp-app.result }}" = "success" ] \
          && [ "${{ needs.mcp-durable.result }}" = "success" ] \
          && [ "${{ needs.mcp-image.result }}" = "success" ] \
          && [ "${{ needs.frontend.result }}" = "success" ] \
          && [ "${{ needs.infra.result }}" = "success" ] \
          || { echo "One or more CI jobs failed"; exit 1; }
