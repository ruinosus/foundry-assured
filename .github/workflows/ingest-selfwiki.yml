name: Ingest selfwiki knowledge base

# O conteúdo que o domínio selfwiki responde vive em knowledge/wiki-bundle/ neste repo, mas só
# fica visível para quem pergunta depois de uma INGESTÃO: subir os bundles pro blob, rodar o
# indexador do Azure AI Search e — o passo que faltou da última vez — CARIMBAR cada documento
# com o grupo de leitura (permissionFilter). Esse carimbo é o passo 5/5 de `ingest_selfwiki()`
# em app/modules/knowledge/internal/ingest_docbundles.py.
#
# Ele não rodou depois de uma regeneração da wiki, e ninguém percebeu: 72 documentos ficaram no
# índice com `permissionFilterOption: enabled` e NENHUM grupo — fail-closed funcionando
# exatamente como projetado, sobre conteúdo que nunca recebeu ACL. O domínio respondeu "não sei"
# sobre a própria documentação por meses. Este workflow fecha esse buraco: dispara sozinho
# quando o bundle muda, e PROVA que o conteúdo ficou visível antes de declarar sucesso — rodar
# o comando sem checar o resultado foi exatamente o que falhou da vez passada.
#
# Bug de seleção de versão (encontrado investigando, corrigido aqui — não no código Python):
# `knowledge/wiki-bundle/<componente>/<versão>/` guarda TODAS as versões já geradas — a
# regeneração da wiki nunca apaga a anterior (ver PR #173, que soma v0.20260819 ao lado de
# v0.20260816 já existente). `ingest_selfwiki()` varre RECURSIVAMENTE o diretório que recebe em
# TECHDOCS_DOCBUNDLES (`docbundles.rglob("manifest.json")`) — se apontássemos ele pro diretório
# pai, as duas versões entrariam juntas no mesmo lote de upload: blobs duplicados, e o pruning
# interno (`_prune_stale_blobs`) só remove blobs que NÃO estão no lote atual, então nada seria
# "stale" — conteúdo velho e novo ficariam lado a lado no índice para sempre. O passo
# "Selecionar a versão mais recente" abaixo resolve isso ANTES de chamar o Python: copia só a
# versão mais recente de cada componente pra um diretório de staging e aponta
# TECHDOCS_DOCBUNDLES pra lá — assim o pruning existente continua funcionando como projetado.
#
# Gatilho duplo: push em main filtrado por knowledge/wiki-bundle/** — é o único diretório que
# alimenta o índice selfwiki-docbundles-ks-index. `knowledge/corpus/` é o corpus do helpdesk:
# fica de FORA de propósito, tem seu próprio workflow manual (`provision-kb.yml`, só
# workflow_dispatch) porque é a base congelada do eval (CLAUDE.md: "13 runbooks fictícios →
# KB do helpdesk; congelado, base do eval") — reingestão automática mudaria a baseline do eval
# sem ninguém decidir isso, e `ingest.py` (o script que a alimenta) nem chama o carimbo de ACL.
# Mais workflow_dispatch, pra rodar sob demanda (ex.: depois de corrigir uma variável, sem
# esperar o próximo push).
#
# Idempotência: rodar isto duas vezes seguidas é seguro. Upload de blob é overwrite; criação de
# knowledge source/base é create_or_update; blobs de versões antigas são podados
# (_prune_stale_blobs) e os chunks órfãos correspondentes no índice também (purge_orphans); o
# carimbo de ACL sempre re-escreve o mesmo grupo pros mesmos documentos. Nada é destrutivo — uma
# segunda execução sem mudança de conteúdo reprocessa (custo de reindexação) mas não altera o
# resultado nem apaga nada que não devesse.
#
# Ordem indexador → carimbo: `ingest_selfwiki()` já garante isso sozinha, não precisamos
# reforçar aqui — quando APP_USERS_GROUP_ID está definido (está, ver `gh variable list`), ela
# BLOQUEIA no indexador (wait_s=900) antes de chamar `setup_acl`: carimbar documentos que ainda
# não existem no índice não faria nada. O timeout do job abaixo dá folga pros até 15 min de
# espera bloqueante mais o resto do pipeline + verificação.
on:
  push:
    branches: [main]
    paths:
      - knowledge/wiki-bundle/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Azure OIDC

jobs:
  ingest-selfwiki:
    name: Ingest + verify selfwiki KB
    runs-on: ubuntu-latest
    environment: production # o repo já exige revisor humano neste Environment — o portão do problema original
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v5

      - name: Selecionar a versão mais recente de cada bundle
        # Puro filesystem — roda ANTES do login no Azure, então se a árvore de
        # knowledge/wiki-bundle estiver quebrada isto falha rápido sem gastar login. Ver o
        # comentário de cabeçalho sobre o bug de seleção de versão. Os nomes de versão
        # (v0.YYYYMMDD, gerados em wiki-regen.yml) são zero-padded, então ordem alfabética =
        # ordem cronológica — o mesmo pressuposto que o resto do pipeline de wiki já usa.
        working-directory: .
        run: |
          set -euo pipefail
          SRC="knowledge/wiki-bundle"
          STAGE="$RUNNER_TEMP/selfwiki-docbundles"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          shopt -s nullglob
          found=0
          for comp_dir in "$SRC"/*/; do
            comp="$(basename "$comp_dir")"
            latest="$(ls -1 "$comp_dir" | sort | tail -1)"
            if [ -z "$latest" ]; then
              echo "  ⚠️  $comp não tem nenhuma versão — pulando"
              continue
            fi
            older="$(ls -1 "$comp_dir" | grep -v "^$latest\$" | tr '\n' ' ' || true)"
            echo "  ▸ $comp: usando $latest${older:+ (ignorando: $older)}"
            cp -r "$comp_dir$latest" "$STAGE/$comp"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "❌ nenhum bundle encontrado sob $SRC" >&2
            exit 1
          fi
          echo "TECHDOCS_DOCBUNDLES=$STAGE" >> "$GITHUB_ENV"
          # Conta as páginas (manifest.json + pages/*.md) do lote selecionado — usado só como
          # referência no passo de verificação (checagem 3, diagnóstico): o índice guarda chunks,
          # não páginas, então a contagem final é MAIOR que esta (uma página vira N chunks). O
          # que importa não é bater igual, é não desabar — ver comentário na verificação.
          BUNDLE_PAGE_COUNT="$(find "$STAGE" -path '*/pages/*.md' -type f | wc -l | tr -d ' ')"
          echo "  ▸ total de páginas no lote selecionado: $BUNDLE_PAGE_COUNT"
          echo "BUNDLE_PAGE_COUNT=$BUNDLE_PAGE_COUNT" >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen

      - name: Ingest selfwiki (upload → indexador → carimbo de ACL)
        # --selfwiki roda o pipeline de 5 passos completo (ingest_selfwiki, em
        # ingest_docbundles.py): upload dos bundles, knowledge source de blob (criada uma vez,
        # pulada se já existe), KB searchIndex (a KB ativa), indexador — bloqueante quando há
        # audience configurada — e o carimbo de ACL, o passo que faltou da última vez.
        env:
          AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_RESOURCE_ID: ${{ vars.AZURE_STORAGE_RESOURCE_ID }}
          APP_USERS_GROUP_ID: ${{ vars.APP_USERS_GROUP_ID }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
          # GAP CONHECIDO (reportado no PR, não inventado aqui): AZURE_AI_OPENAI_ENDPOINT não
          # existe hoje em `gh variable list` nem em scripts/sync-gh-variables.sh, mas é
          # "REQUIRED (KB)" segundo apps/backend/.env.example — a criação/atualização da KB
          # searchIndex do selfwiki (passo 3/5, roda em TODA execução, não só na primeira) usa
          # esse endpoint pra montar o modelo de resposta. Sem essa variável cadastrada no repo
          # (`gh variable set AZURE_AI_OPENAI_ENDPOINT ...`, valor em `azd env get-values`),
          # este step falha na chamada à Azure (resource_url vazio), não silenciosamente.
          AZURE_AI_OPENAI_ENDPOINT: ${{ vars.AZURE_AI_OPENAI_ENDPOINT }}
        run: uv run python -m app.modules.knowledge.internal.ingest_docbundles --selfwiki

      - name: Verificar — documentos carimbados e visíveis por identidade
        # Rodar o comando não basta — foi exatamente isso que falhou da vez passada (terminou
        # sem erro, e o carimbo não tinha pego). Este passo PROVA visibilidade em vez de confiar
        # só no exit code do passo anterior, e FALHA o job se a prova não fechar.
        #
        # Desenho anterior (removido, não mantido como fallback): a checagem 1 usava o header
        # `x-ms-enable-elevated-read` pra ler o índice sem passar pelo filtro de permissão. Em
        # produção esse header sempre voltou HTTP 400 — "Search Index Data Contributor" TEM a
        # ação `elevatedOperations/read`, o service principal do CI TEM esse papel no escopo
        # certo, e mesmo assim a leitura elevada foi recusada; não foi possível isolar a causa
        # além disso. Uma checagem que sempre falha vira ruído que ensina a ignorar o passo —
        # por isso ela saiu, em vez de virar um `continue-on-error` disfarçado.
        #
        # No lugar dela, uma prova mais forte e que agora é possível: o service principal do CI
        # (AZURE_CLIENT_ID) foi adicionado ao grupo app-users
        # (`az ad group member check` confirmou membresia em 20/ago). Consultar o índice COM a
        # identidade do próprio runner é o caminho real que um usuário autenticado percorre —
        # prova o carimbo E o trim funcionando ao mesmo tempo, o que a leitura elevada nunca
        # provou (ela só provava o carimbo).
        #
        # Três buscas contra o MESMO índice:
        #   1) GATE — busca COM `x-ms-query-source-authorization` = token deste runner (escopo
        #      https://search.azure.com/.default). Tem que voltar documento, e TODO documento
        #      retornado tem que ter o grupo esperado em `groups`. Zero documentos derruba o job
        #      — mas zero não diz sozinho qual das duas coisas quebrou (carimbo ausente ou
        #      membresia de grupo perdida); a mensagem de erro lista as duas leituras possíveis
        #      em vez de escolher uma.
        #   2) GATE — a MESMA busca, agora SEM o header de identidade. Num índice com
        #      `permissionFilterOption: enabled` isso TEM que devolver zero por desenho (medido
        #      em 19/ago contra este mesmo índice: 115 documentos com identidade, 0 sem). Se
        #      devolver algo, o fail-closed quebrou — falha grave, não sucesso parcial.
        #   3) DIAGNÓSTICO — compara a contagem de documentos (chunks) da checagem 1 com o total
        #      de páginas do bundle selecionado (BUNDLE_PAGE_COUNT, calculado no passo "Selecionar
        #      a versão mais recente"). Não derruba o job: chunking faz uma página virar vários
        #      documentos, então os números não batem igual — mas uma queda brusca entre
        #      execuções é sinal que alguém vai querer investigar, por isso fica logado.
        env:
          AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
          APP_USERS_GROUP_ID: ${{ vars.APP_USERS_GROUP_ID }}
          BUNDLE_PAGE_COUNT: ${{ env.BUNDLE_PAGE_COUNT }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          from azure.identity import DefaultAzureCredential

          from app.modules.tenancy.public import tenant_config

          API = "2025-08-01-preview"
          SCOPE = "https://search.azure.com/.default"

          cfg = tenant_config()
          index = cfg.selfwiki_search_index
          endpoint = cfg.azure_search_endpoint.rstrip("/")
          audience = cfg.app_users_group_id
          if not audience:
              sys.exit("❌ APP_USERS_GROUP_ID vazio — nada pra verificar (o carimbo também não rodou).")

          token = DefaultAzureCredential().get_token(SCOPE).token

          def search(extra_headers, top=1000):
              rows, skip = [], 0
              while True:
                  req = urllib.request.Request(
                      f"{endpoint}/indexes/{index}/docs/search?api-version={API}",
                      method="POST",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Content-Type": "application/json",
                          **extra_headers,
                      },
                      data=json.dumps(
                          {"search": "*", "select": "uid,blob_url,groups", "top": top, "skip": skip}
                      ).encode(),
                  )
                  with urllib.request.urlopen(req, timeout=60) as r:
                      page = json.load(r).get("value", [])
                  rows += page
                  if len(page) < top:
                      break
                  skip += len(page)
              return rows

          print(f"== 1/3 (GATE): busca COM identidade do runner — carimbo + trim, o caminho real do usuário (índice '{index}') ==")
          with_identity = search({"x-ms-query-source-authorization": f"Bearer {token}"})
          if not with_identity:
              sys.exit(
                  "❌ FALHA: busca COM identidade voltou vazio. Duas leituras possíveis, não dá "
                  "pra saber qual sem investigar: (a) o carimbo de ACL não rodou/não pegou nesta "
                  f"execução (a ingestão terminou sem erro mas não escreveu `groups`); (b) o "
                  f"service principal de AZURE_CLIENT_ID deixou de ser membro do grupo app-users "
                  f"({audience}) no Entra — confirme com `az ad group member check --group "
                  f"{audience} --member-id <object-id-do-SP>`."
              )
          unstamped = [d.get("blob_url", d.get("uid")) for d in with_identity if audience not in (d.get("groups") or [])]
          if unstamped:
              print(f"❌ FALHA: {len(unstamped)}/{len(with_identity)} documentos retornados SEM o grupo {audience}:")
              for u in unstamped[:15]:
                  print(f"   - {u}")
              sys.exit(1)
          print(f"✅ {len(with_identity)} documentos, todos carimbados com o grupo app-users ({audience}) e visíveis pra quem é membro.")

          print("\n== 2/3 (GATE): busca SEM identidade — tem que devolver zero (fail-closed) ==")
          no_identity = search({}, top=1)
          if no_identity:
              sys.exit(f"❌ FALHA: busca sem identidade devolveu {len(no_identity)} documento(s) — fail-closed quebrado.")
          print("✅ 0 documentos — fail-closed confirmado.")

          print("\n== 3/3 (diagnóstico, não derruba o job): contagem de documentos vs. páginas do bundle ==")
          bundle_pages = os.environ.get("BUNDLE_PAGE_COUNT", "").strip()
          if bundle_pages:
              print(
                  f"  ▸ documentos no índice (chunks, checagem 1): {len(with_identity)}\n"
                  f"  ▸ páginas no bundle selecionado (manifest.json): {bundle_pages}\n"
                  "  (números não precisam bater — chunking faz uma página virar vários "
                  "documentos; uma queda brusca em relação à execução anterior é o sinal a "
                  "observar, não a igualdade.)"
              )
          else:
              print("  ⚠️  BUNDLE_PAGE_COUNT não disponível — pulando a comparação.")

          print("\n✅ verificação concluída — conteúdo do selfwiki está carimbado, visível por identidade e o fail-closed está ativo.")
          PY
