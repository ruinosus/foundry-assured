name: Wiki regen

# Closes the loop that wiki-freshness only opens (ADR-016). Replaces the guarded `echo`
# placeholder ADR-012 shipped: the generator is OpenWiki, consumed rather than written here.
#
# The shape, and who owns each step:
#
#   wiki-freshness (workflow_call)   TRIGGER   — ours, deterministic
#   openwiki code --update           GENERATOR — theirs, commodity
#   adapt_openwiki → bundle          FORMAT    — ours
#   fidelity >= build.fidelity_min   GATE      — ours, the one that matters
#   pull request                     GATE      — human
#
# Deliberately NOT scheduled yet. ADR-016 says adopt on workflow_dispatch first, look at the pull
# requests it opens, and only then turn on a cron — the spike measured that three consecutive runs
# over unchanged source still edited 15 → 2 → 1 files, so a daily cron would open a PR most days
# for agent-taste revisions. Driving it from the freshness trigger is what keeps that in check;
# proving that on real runs is what earns the schedule.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even when the freshness check reports no drift
        type: boolean
        default: false
      rebuild:
        description: Discard the existing wiki and write it from scratch (--init)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Ask the deterministic gate, rather than trusting the agent to decide it has nothing to do.
  drift:
    uses: ./.github/workflows/wiki-freshness.yml

  regen:
    name: regenerate the wiki via OpenWiki
    needs: drift
    if: ${{ needs.drift.outputs.stale == 'true' || inputs.force }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # ONE component, the whole repository (see wiki_freshness_test._AREA for why).
      COMPONENT: foundry-assured
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so `openwiki code --update` can diff HEAD against the commit it last
          # documented; a shallow clone hides that commit and the update runs against an empty
          # change summary.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6

      - name: Install OpenWiki
        # Pinned: this is a generator whose output we gate on, so an unannounced upgrade is a
        # silent change to the wiki. Bump deliberately, like any other vendored tool.
        run: npm install --global openwiki@0.3.3

      - name: Regenerate the wiki
        working-directory: .
        env:
          # Azure OpenAI through the openai-compatible provider — measured working with the key
          # sent as a bearer token (spike, ADR-016). No `azure` provider exists in OpenWiki.
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENWIKI_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENWIKI_API_KEY }}
          OPENAI_COMPATIBLE_USE_RESPONSES_API: "false"
          # Nothing leaves the controlled environment without a reason.
          OPENWIKI_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        # Model sizing is not a footnote: the spike measured a small model planning the wiki and
        # then stalling in the critic loop without emitting a page.
        #
        # --init when there is no wiki yet, --update after. An early run used --update against a
        # repository with no openwiki/ directory: it behaved as an incremental pass over an empty
        # base and produced 3 pages describing the most recent commits, not a wiki. --update keeps
        # a wiki current; it is not how one is born.
        #
        # No .openwikiignore any more: one wiki covers the whole repository, so there is nothing to
        # scope away. The per-area scoping that used to live here is what forced the single-bundle
        # decision — OpenWiki keeps ONE openwiki/ per repository, and running a second area would
        # have meant `--update` on a wiki about a different area with the generator scoped away
        # from the files that wiki describes.
        run: |
          # `openwiki/` alone is NOT the test: openwiki/INSTRUCTIONS.md is committed (it is the
          # citation contract, authored not generated), so the directory always exists. The wiki
          # itself is what may be missing — OpenWiki writes index.md at the root of its output.
          MODE=--update
          [ -f openwiki/index.md ] || MODE=--init

          # `rebuild` exists because "a wiki is present" and "a wiki of the right SCOPE is present"
          # are different questions, and only the first one is answerable from disk. When the
          # per-area bundles collapsed into one (ADR-016 amendment), the wiki on disk covered
          # apps/backend only. --update dutifully diffed the last documented commit, adjusted the
          # few changed files, and produced an 11-page bundle labelled as the whole repository at
          # 97.5% fidelity: every citation resolved, and the bundle still lied about its coverage.
          # A gate that scores citations cannot catch that, so a human says when to start over.
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "▸ rebuild requested — discarding the existing wiki (keeping INSTRUCTIONS.md)"
            find openwiki -mindepth 1 -maxdepth 1 ! -name INSTRUCTIONS.md -exec rm -rf {} +
            MODE=--init
          fi
          echo "▸ openwiki code $MODE"
          openwiki code "$MODE" --print --modelId "${{ vars.OPENWIKI_MODEL }}" \
            "Follow openwiki/INSTRUCTIONS.md exactly — in particular the citation format, using \
             commit SHA $GITHUB_SHA."

      - name: Adapt the OpenWiki output into the ingest bundle
        working-directory: apps/backend
        run: |
          uv sync --frozen
          VERSION="v0.$(date -u +%Y%m%d)"
          echo "BUNDLE_VERSION=$VERSION" >> "$GITHUB_ENV"
          uv run python -m app.modules.knowledge.internal.adapt_openwiki \
            --repo "$GITHUB_WORKSPACE" \
            --component "$COMPONENT" \
            --version "$VERSION" \
            --out "$GITHUB_WORKSPACE/knowledge/wiki-bundle"

      - name: Fidelity gate
        working-directory: apps/backend
        # THE gate. A bot writing the wiki unattended raises the value of this check, it does not
        # retire it: below the floor the bundle is kept for inspection and must not reach the KB.
        #
        # --version is passed EXPLICITLY, never inferred. The first automated run let the gate pick
        # "the newest bundle" and it picked v0.3.0 over v0.20260815 (lexical ordering), grading the
        # previous bundle at 97.6%, passing, and opening a PR for one that scores 75.6% — under the
        # floor. The ordering bug is fixed too, but this step knows exactly which bundle it just
        # produced, and a gate should never have to guess its own subject.
        run: |
          uv run python -m eval.wiki_fidelity_test \
            --component "$COMPONENT" \
            --version "$BUNDLE_VERSION"

      # PODAR SÓ AQUI, e não antes: o passo acima é o gate. Um bundle abaixo do piso de
      # fidelidade não pode chegar à base — se a poda viesse primeiro, uma geração ruim
      # apagaria a boa e deixaria a prateleira vazia (ou pior, só com o ruim).
      #
      # POR QUE PODAR. `adapt_openwiki` escreve numa pasta datada nova e nunca remove a
      # anterior, então cada regeneração soma uma versão. `collect_pages` varre a prateleira
      # inteira: as duas gerações das MESMAS páginas entrariam na base, e a antiga seria
      # servida sempre que ranqueasse melhor. `eval.wiki_shelf_test` reprova esse estado — e
      # reprovou a PR da regeneração de 19/ago, que precisou de poda manual.
      #
      # Um bundle velho não precisa estar quebrado para fazer estrago; basta continuar ali.
      # O git guarda o histórico, a prateleira guarda só a geração corrente.
      - name: Retirar a geração anterior da prateleira
        run: |
          set -euo pipefail
          DIR="$GITHUB_WORKSPACE/knowledge/wiki-bundle/$COMPONENT"
          [ -d "$DIR" ] || { echo "sem prateleira em $DIR — nada a podar"; exit 0; }
          for v in "$DIR"/*/; do
            nome="$(basename "$v")"
            if [ "$nome" != "$BUNDLE_VERSION" ]; then
              echo "  removendo geração anterior: $COMPONENT/$nome"
              rm -rf "$v"
            fi
          done
          echo "  na prateleira agora:"
          ls -1 "$DIR"

      - name: Open a pull request with the refreshed bundle
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            openwiki
            knowledge/wiki-bundle
            AGENTS.md
            CLAUDE.md
          branch: wiki/regen
          commit-message: "docs(wiki): regenerate the wiki"
          title: "docs(wiki): regenerate the wiki"
          body: |
            Automated regeneration — the freshness trigger reported drift.

            Generated by OpenWiki, adapted into the ingest bundle format, and **past the fidelity
            floor** (`build.fidelity_min` in `eval/assurance.yaml`) — the bundle would not be here
            otherwise.

            Review for accuracy, not for formatting: the citations were checked mechanically, the
            claims were not.
