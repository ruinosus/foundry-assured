name: Deploy (Azure Container Apps)

# Deploys the backend + frontend to Azure Container Apps via azd. Two entrypoints:
#   • release: published — release-please cut a release (see release.yml) → deploy.
#   • workflow_dispatch  — manual, ad-hoc deploy.
# Both stop at the `production` Environment gate below until a reviewer approves,
# so cutting a release never deploys on its own — a human always confirms.
# Does NOT redeploy the hosted agent (that would reset its content-safety guardrail).
# Requires Azure OIDC + repo vars/secrets — see CONTRIBUTING.md › CI/CD setup.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      services:
        description: Services to deploy
        type: choice
        default: backend web
        options:
          - backend web
          - backend
          - web

permissions:
  contents: read
  id-token: write # Azure OIDC

jobs:
  deploy:
    name: azd provision + deploy
    runs-on: ubuntu-latest
    environment: production # add reviewers to this GitHub Environment to gate deploys
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v5
      - uses: Azure/setup-azd@v2
      - name: Install azd Foundry agents extension
        # azure.yaml declares the hosted agent (host: azure.ai.agent). azd needs the
        # azure.ai.agents extension just to PARSE that service — without it, even
        # `azd provision` (backend/web only) aborts with "unsupported host". The
        # fresh runner has no extensions; install is idempotent + GA (no alpha flag).
        run: azd extension install azure.ai.agents
      - name: azd login (OIDC)
        run: >
          azd auth login --federated-credential-provider github
          --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID"
      - name: az login (OIDC)
        # Login SEPARADO do `azd auth login` acima: são dois CLIs com credenciais próprias.
        # Só precisamos deste para o `az ad sp show` no passo seguinte (resolver o object-id
        # do SP de CI) — mesmo padrão já usado em provision-kb.yml/eval-cloud.yml/etc.
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve CI principal object-id
        id: ci_principal
        run: |
          # O bicep (resources.bicep: ciSearchContributor/ciSearchIndexContributor/
          # ciStorageContributor) precisa do OBJECT-ID do service principal, não do appId
          # (AZURE_CLIENT_ID) — são coisas diferentes. Ver CONTRIBUTING.md › CI/CD setup.
          #
          # Se a leitura no Graph falhar (falta de permissão pra ler o próprio SP é comum em
          # tenants restritos), NÃO travamos o job aqui: só avisamos e seguimos com o valor
          # vazio. Quem trava de verdade é o passo "Confere se o CI recebeu as roles de dado"
          # logo após o provision — ele sabe que está em CI (diferente do bicep) e falha com uma
          # mensagem acionável. Fazer os dois pontos falharem seria duplicar o mesmo sintoma sob
          # duas mensagens diferentes.
          CI_PRINCIPAL_ID="$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv 2>/dev/null || true)"
          if [ -z "$CI_PRINCIPAL_ID" ]; then
            echo "::warning::Não foi possível resolver o object-id do SP de CI via Graph (az ad sp show --id \$AZURE_CLIENT_ID). AZURE_CI_PRINCIPAL_ID vai ficar vazio nesta run — o provision pula as 3 roles de dado do CI e o passo de verificação após o provision vai falhar o job."
          fi
          echo "id=$CI_PRINCIPAL_ID" >> "$GITHUB_OUTPUT"
      - name: Configure deploy env (NEXT_PUBLIC + Entra)
        run: |
          azd env new "$AZURE_ENV_NAME" --no-prompt || azd env select "$AZURE_ENV_NAME"
          # The deployer here is the CI service principal, not a person — so the
          # deployer data-plane role assignments must use ServicePrincipal, else ARM
          # rejects them: "UnmatchedPrincipalType ... specified PrincipalType 'User'".
          azd env set AZURE_PRINCIPAL_TYPE            "ServicePrincipal"
          # Object-id do próprio SP de CI, resolvido no passo anterior — grants Azure AI User +
          # Search Service/Index Contributor + Storage Blob Data Contributor (resources.bicep).
          # Sem isto as 3 roles são puladas em silêncio e a ingestão da KB 403 no data plane.
          azd env set AZURE_CI_PRINCIPAL_ID           "${{ steps.ci_principal.outputs.id }}"
          # AI Search was provisioned in a different region (capacity override). Without
          # this, bicep defaults it to AZURE_LOCATION and the idempotent re-provision
          # fails: "resource already exists in location eastus ... cannot be created in eastus2".
          azd env set AZURE_SEARCH_LOCATION           "${{ vars.AZURE_SEARCH_LOCATION }}"
          # selfwiki's private read audience = the app-users group. Without this the deployed backend
          # leaves APP_USERS_GROUP_ID empty → the /selfwiki ACL header isn't sent → retrieve returns 0.
          azd env set APP_USERS_GROUP_ID              "${{ vars.APP_USERS_GROUP_ID }}"
          azd env set NEXT_PUBLIC_ENTRA_TENANT_ID     "${{ vars.NEXT_PUBLIC_ENTRA_TENANT_ID }}"
          azd env set NEXT_PUBLIC_ENTRA_SPA_CLIENT_ID "${{ vars.NEXT_PUBLIC_ENTRA_SPA_CLIENT_ID }}"
          azd env set NEXT_PUBLIC_ENTRA_API_CLIENT_ID "${{ vars.NEXT_PUBLIC_ENTRA_API_CLIENT_ID }}"
          azd env set ENTRA_TENANT_ID                 "${{ vars.ENTRA_TENANT_ID }}"
          azd env set ENTRA_API_CLIENT_ID             "${{ vars.ENTRA_API_CLIENT_ID }}"
          azd env set ENTRA_API_CLIENT_SECRET         "${{ secrets.ENTRA_API_CLIENT_SECRET }}"
      - name: Provision (idempotent)
        run: azd provision --no-prompt
      - name: Confere se o CI recebeu as roles de dado
        # O bicep pula ciSearchContributor/ciSearchIndexContributor/ciStorageContributor em
        # silêncio quando ciPrincipalId vem vazio — um provision verde não significa CI com
        # acesso a dado. Este é o ÚNICO lugar que trava por isso: bicep não tem fail(), e um
        # provision LOCAL (pessoa, sem CI) tem o mesmo output vazio de forma legítima — só este
        # workflow sabe que está em CI e pode cobrar. Falha o job (não só avisa) porque a
        # ingestão da KB via CI (provision-kb.yml/eval-cloud.yml) vai 403 de qualquer forma; é
        # melhor descobrir aqui, com mensagem acionável, do que numa run de ingest sem contexto.
        run: |
          ASSIGNED="$(azd env get-values | grep '^CI_DATA_PLANE_ROLES_ASSIGNED=' | cut -d= -f2 | tr -d '"')"
          if [ "$ASSIGNED" != "true" ]; then
            echo "::error::O CI ficou sem as 3 roles de dado (Storage Blob Data Contributor + Search Service/Index Data Contributor) porque AZURE_CI_PRINCIPAL_ID ficou vazio. Resolva com: az ad sp show --id <appId-do-SP-de-CI> --query id -o tsv, depois: azd env set AZURE_CI_PRINCIPAL_ID <object-id> && azd provision"
            exit 1
          fi
      - name: Deploy selected services
        run: |
          for svc in ${{ inputs.services || 'backend web' }}; do
            azd deploy "$svc" --no-prompt
          done
      # O deploy termina "verde" mesmo quando o app nasce mudo: em 2026-08 ele subiu com
      # AZURE_STORAGE_ACCOUNT vazia (nunca declarada no bicep) e respondeu 200 no health, serviu
      # o helpdesk, e ao mesmo tempo dava 403 em toda citação e 404 em toda conversa — sem um
      # único erro no log. Este passo compara a config que CHEGOU ao container com o que o
      # registry declara e falha quando uma contradiz a outra.
      - name: Config do ambiente sustenta o registry (pós-deploy)
        working-directory: apps/backend
        env:
          AZURE_TARGET_APP: ca-backend-${{ env.AZURE_RESOURCE_TOKEN }}
          AZURE_TARGET_RG: ${{ env.AZURE_RESOURCE_GROUP }}
        run: |
          APP="$(az containerapp list -g "$AZURE_TARGET_RG" \
                 --query "[?starts_with(name,'ca-backend')].name | [0]" -o tsv)"
          AZURE_TARGET_APP="$APP" uv run python -m eval.deployment_config_test

      - name: Web URL
        if: always()
        run: azd env get-values | grep -E '^WEB_URL=' >> "$GITHUB_STEP_SUMMARY" || true
